name: Verify current compiler binaries and package release
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: compiler-release-replay-${{ github.ref }}
  cancel-in-progress: false
jobs:
  replay:
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      BINARY_SOURCE: '680c4f0c4439bd7435addebfc57a1a16c3c320e3'
      BINARY_RUN: '41295495489'
      COMPILER_TEST_SOURCE_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/recovery/evidence/
      - uses: actions/download-artifact@v4
        with:
          name: refactor-core-lifecycle-41295495489-1
          github-token: ${{ github.token }}
          run-id: 41295495489
          path: work/original-acceptance
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Install pinned acceptance dependencies
        run: python -m pip install -r recovery/probes/TextureRedirect/requirements.txt -r recovery/scripts/app-protocol-requirements.txt lxml==6.0.2
      - name: Verify production closure and reuse only independently successful source scopes
        shell: pwsh
        run: |
          git diff --exit-code $env:BINARY_SOURCE HEAD -- recovery/src SDK ui recovery/build 'recovery/scripts/Build*.ps1' recovery/scripts/RestoreUiDependencies.ps1
          if($LASTEXITCODE -ne 0){throw 'Production inputs differ; runtime reuse rejected'}
          $jobs=(gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:BINARY_RUN/jobs"|ConvertFrom-Json).jobs
          $job=@($jobs|Where-Object name -eq 'lifecycle')[0]
          if($job.status -cne 'completed'){throw 'Original acceptance has not finished'}
          $required=@('Standalone P2 application contracts in Debug','Standalone P2 application contracts in Release','Validate CLI scripts and output contracts before long Native linking','Build managed Foundation inputs','Build full production combination and verify deployment and route metadata','Existing hot-cache sizes dependencies and report schemas with current Release','Current FLA integration with optimized Core and session caches','Built-in Texture original payload differential in Debug and Release','Common texture input and output formats in Debug and Release','Real production CLI, cold processes and actual CtrlBreak cancellation','Validate real production CLI protocol outputs','Actual build-cache cold hot invalidation and retry matrix','Effective input roots and original BAB output differential','Actual Audio CDATA and W3X build-cache payload replay','Actual session-cache documents intermediate and CDATA reuse matrix','Validate actual session-cache protocol outputs','Validate actual cache and input-root protocol outputs')
          foreach($name in $required){if(@($job.steps|Where-Object{$_.name -ceq $name -and $_.conclusion -ceq 'success'}).Count -ne 1){throw "No independent successful original scope: $name"}}
          $patches=@('recovery/scripts/TestCompilerBig.ps1','recovery/scripts/TestCompilerParallel.py','recovery/scripts/TestCompilerPerformance.py','recovery/scripts/TestCompilerSdk.ps1','recovery/scripts/MeasureCompilerParallel.py','recovery/tests/CompilerXmlBackendBatch.cs')
          foreach($path in $patches){if($path.EndsWith('.ps1')){$tokens=$null;$errors=$null;[Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path),[ref]$tokens,[ref]$errors)|Out-Null;if($errors.Count){throw ($errors|Out-String)}}}
          git checkout --detach $env:BINARY_SOURCE
          if($LASTEXITCODE -ne 0){throw 'Cannot select exact production source'}
          git restore --source=$env:COMPILER_TEST_SOURCE_COMMIT -- $patches
          if($LASTEXITCODE -ne 0){throw 'Cannot apply identified test-only corrections'}
          New-Item -ItemType Directory -Force recovery/artifacts | Out-Null
          Copy-Item work/original-acceptance/artifacts/core-lifecycle-product recovery/artifacts/ -Recurse
          New-Item -ItemType Directory -Force recovery/evidence/refactor/core-cli|Out-Null
          Copy-Item "work/original-acceptance/evidence/refactor/core-cli/$env:BINARY_RUN-1" recovery/evidence/refactor/core-cli/ -Recurse
          foreach($mode in @('Debug','Release')){
            $product="recovery/artifacts/core-lifecycle-product/$mode";$build=Get-Content "$product/build.json" -Raw|ConvertFrom-Json
            if($build.sourceCommit -cne $env:BINARY_SOURCE -or $build.configuration -cne $mode -or $build.containsProbeOrTestSources -ne $false){throw 'Original production receipt identity differs'}
            if((Get-FileHash "$product/bin/NewModCompiler.exe" -Algorithm SHA256).Hash.ToLowerInvariant() -cne $build.exeSha256){throw 'Original EXE differs from its receipt'}
            if(@(Get-ChildItem "$product/bin" -Force).Count -ne 3){throw 'Unexpected production runtime files'}
            foreach($file in @(@{runtime="$product/bin/NewModCompiler.exe.config";source='recovery/src/App/App.config'},@{runtime="$product/bin/antlr.runtime.dll";source='SDK/tools/antlr.runtime.dll'})){if((Get-FileHash $file.runtime -Algorithm SHA256).Hash -cne (Get-FileHash $file.source -Algorithm SHA256).Hash){throw 'Production runtime input differs'}}
          }
          $out="recovery/evidence/refactor/release-replay/$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT";New-Item -ItemType Directory -Force $out|Out-Null
          @{binarySourceCommit=$env:BINARY_SOURCE;binaryBuildRunId=$env:BINARY_RUN;originalRunConclusion=$job.conclusion;testSourceCommit=$env:COMPILER_TEST_SOURCE_COMMIT;runId=$env:GITHUB_RUN_ID;productionInputsUnchanged=$true;reusedSuccessfulSteps=$required;originalFailedSteps=@($job.steps|Where-Object conclusion -eq 'failure'|ForEach-Object name);scope='Reuse successful production build and unaffected independent groups; retain original failed run and replay corrected harness groups, complete SDK, independent ZIP and full Upheaval without rebuilding production'}|ConvertTo-Json -Depth 8|Set-Content "$out/reuse.json"
      - name: Replay complete Core fixtures including Joypad metadata routes
        if: ${{ !cancelled() }}
        shell: pwsh
        run: ./recovery/scripts/TestCompilerCoreLifecycle.ps1 -CompilerDirectory recovery/artifacts/core-lifecycle-product -OutputDirectory "recovery/evidence/refactor/core-lifecycle/$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
      - name: Replay original BAB targeted backend oracle
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          foreach($mode in @('Debug','Release')){./recovery/scripts/TestCompilerBackendBaseline.ps1 -FixtureResult "recovery/evidence/refactor/core-lifecycle/$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT/$mode/CompilerBackendLifecycle/result.json" -OutputDirectory "recovery/evidence/refactor/core-backend-baseline/$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT/$mode" -TimeoutSeconds 180}
      - name: Replay profiling and original byte gates with explicit BIG version
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          python recovery/scripts/TestCompilerPerformance.py --exe recovery/artifacts/core-lifecycle-product/Release/bin/NewModCompiler.exe --sdk SDK --output "recovery/evidence/refactor/performance/$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT" --work "$env:RUNNER_TEMP/release-performance" --source-commit $env:BINARY_SOURCE --budget 60 --timeout 10
          if($LASTEXITCODE -ne 0){throw 'Profiling acceptance failed'}
      - name: Replay complete parallel and cache matrix in independent namespaces
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          python recovery/scripts/TestCompilerParallel.py --repo . --products recovery/artifacts/core-lifecycle-product --work "$env:RUNNER_TEMP/release-parallel" --output "recovery/evidence/refactor/backend-parallel/$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT" --source-commit $env:BINARY_SOURCE
          if($LASTEXITCODE -ne 0){throw 'Parallel acceptance failed'}
      - name: Complete production BIG original LoD MakeBig and Additional acceptance
        if: ${{ !cancelled() }}
        shell: pwsh
        run: ./recovery/scripts/TestCompilerBig.ps1 -CompilerDirectory recovery/artifacts/core-lifecycle-product -OutputDirectory "recovery/evidence/refactor/big/$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
      - name: Complete mymod original SDK differential with explicit BIG version
        if: ${{ !cancelled() }}
        shell: pwsh
        run: ./recovery/scripts/TestCompilerSdk.ps1 -CompilerDirectory recovery/artifacts/core-lifecycle-product -OutputDirectory "recovery/evidence/refactor/sdk-mymod/$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT" -TimeoutSeconds 600
      - name: Validate replay protocol records
        if: ${{ success() }}
        shell: pwsh
        run: |
          foreach($scope in @('core-lifecycle','big')){python recovery/scripts/ValidateAppProtocol.py "recovery/evidence/refactor/$scope/$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT" --source-commit $env:BINARY_SOURCE --output "recovery/evidence/refactor/$scope/$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT/protocol.json";if($LASTEXITCODE -ne 0){throw 'Replay protocol validation failed'}}
      - name: Verify independently extracted three-file packages
        if: ${{ success() }}
        shell: pwsh
        run: ./recovery/scripts/PublishCompiler.ps1 -CompilerDirectory recovery/artifacts/core-lifecycle-product -AcceptanceReceipt "work/original-acceptance/evidence/refactor/core-cli/$env:BINARY_RUN-1/validation.json" -VerifyBigDeployment -OutputDirectory "recovery/artifacts/final-release/$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
      - name: Full Upheaval jobs 1 4 auto cold hot and modified raw byte comparison
        if: ${{ success() }}
        timeout-minutes: 24
        shell: pwsh
        run: |
          python recovery/scripts/MeasureCompilerParallel.py --repo . --exe recovery/artifacts/core-lifecycle-product/Release/bin/NewModCompiler.exe --work "$env:RUNNER_TEMP/release-upheaval" --output "recovery/evidence/refactor/backend-parallel-performance/$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT" --source-commit $env:BINARY_SOURCE --timeout 240 --budget 1320
          if($LASTEXITCODE -ne 0){throw 'Full Upheaval acceptance failed'}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compiler-release-replay-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            recovery/artifacts/core-lifecycle-product/**/build.json
            recovery/artifacts/core-lifecycle-product/**/link-inputs.json
            recovery/artifacts/core-lifecycle-product/**/bin/*
            recovery/artifacts/final-release/**
            recovery/evidence/refactor/**
          if-no-files-found: error
