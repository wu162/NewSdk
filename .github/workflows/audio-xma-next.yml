            recovery/evidence/audio/xma-raw-packet-validation/${{ github.run_id }}-${{ github.run_attempt }}
            recovery/evidence/audio/plugin-validation/${{ github.run_id }}-${{ github.run_attempt }}
            recovery/evidence/audio/sdk-validation/${{ github.run_id }}-${{ github.run_attempt }}
      - name: Preserve exact run evidence without replacing concurrent changes
        if: always()
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          $paths = @('xma-spectral-gate-validation','xma-signal-replay-validation','xma-signal-snapshot-validation','xma-raw-packet-state-validation','xma-signal-validation','xma-next-validation','xma-raw-validation','xma-corpus-validation','xma-rewrite-validation','xma-noise-validation','xma-pcm-validation','xma-window-validation','xma-schedule-validation','xma-fft-validation','xma-dct-validation','xma-dct-snapshot-validation','ssnd-block-validation','xma-window-snapshot-validation','xma-dispatch-validation','xma-numerical-dispatch-validation','aifc-validation','adp4-probe','adp4-decoder-validation','adp4-plugin-validation','xma-codec-metadata-validation','xma-metadata-state-validation','xma-raw-packet-validation','plugin-validation','sdk-validation') | ForEach-Object { "recovery/evidence/audio/$_/$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT" } | Where-Object { Test-Path $_ }
          if ($paths.Count -eq 0) { throw 'No selected run evidence was produced' }
          git add -- $paths
          if ($LASTEXITCODE -ne 0) { throw 'Evidence staging failed' }
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { exit 0 }
          if ($LASTEXITCODE -ne 1) { throw 'Evidence diff failed' }
          git commit -m "audio: preserve XMA next-batch evidence $env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          if ($LASTEXITCODE -ne 0) { throw 'Evidence commit failed' }
          git pull --rebase origin $env:GITHUB_REF_NAME
          if ($LASTEXITCODE -ne 0) { throw 'Concurrent changes require resolution' }
          git push origin "HEAD:$env:GITHUB_REF_NAME"
          if ($LASTEXITCODE -ne 0) { throw 'Evidence push failed' }
