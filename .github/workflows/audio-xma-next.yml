            recovery/evidence/audio/xma-fft-validation/${{ github.run_id }}-${{ github.run_attempt }}
            recovery/evidence/audio/xma-dct-validation/${{ github.run_id }}-${{ github.run_attempt }}
            recovery/evidence/audio/xma-dct-snapshot-validation/${{ github.run_id }}-${{ github.run_attempt }}
            recovery/evidence/audio/ssnd-block-validation/${{ github.run_id }}-${{ github.run_attempt }}
            recovery/evidence/audio/xma-window-snapshot-validation/${{ github.run_id }}-${{ github.run_attempt }}
            recovery/evidence/audio/xma-dispatch-validation/${{ github.run_id }}-${{ github.run_attempt }}
            recovery/evidence/audio/xma-numerical-dispatch-validation/${{ github.run_id }}-${{ github.run_attempt }}
