name: Audio XMA next recovery batch
on:
  push:
    branches: [recovery/audio-compiler-source]
    paths:
      - '.github/workflows/audio-xma-next.yml'
      - 'src/AudioCompiler/Native/XmaOutputRewriter.cs'
      - 'src/AudioCompiler/Native/Xma*Noise*.cs'
      - 'src/AudioCompiler/Native/XmaPcmConverter.cs'
      - 'src/AudioCompiler/Native/XmaPcmWindow.cs'
      - 'src/AudioCompiler/Native/XmaPcmWindowScheduler.cs'
      - 'src/AudioCompiler/Native/XmaComplexFft.cs'
      - 'src/AudioCompiler/Native/XmaDct4.cs'
      - 'src/AudioCompiler/Native/XmaCodecMetadata.cs'
      - 'src/AudioCompiler/Native/XmaRawPacketWriter.cs'
      - 'recovery/scripts/TestAudioXmaRaw.ps1'
      - 'recovery/scripts/TestAudioXmaCorpus.ps1'
      - 'recovery/scripts/TestAudioXmaDispatch.ps1'
      - 'recovery/scripts/TestAudioXmaNumericalDispatch.ps1'
      - 'recovery/scripts/TestAudioAifc.ps1'
      - 'recovery/scripts/TestAudioAdp4Probe.ps1'
      - 'recovery/scripts/TestAudioAdp4Decoder.ps1'
      - 'recovery/scripts/TestAudioAdp4Plugin.ps1'
      - 'src/AudioCompiler/Native/Adp4Decoder.cs'
      - 'recovery/scripts/TestAudioXmaRewrite.ps1'
      - 'recovery/scripts/TestAudioXmaNoise.ps1'
      - 'recovery/scripts/TestAudioXmaPcm.ps1'
      - 'recovery/scripts/TestAudioXmaWindow.ps1'
      - 'recovery/scripts/TestAudioXmaSchedule.ps1'
      - 'recovery/scripts/TestAudioXmaFft.ps1'
      - 'recovery/scripts/TestAudioXmaDct.ps1'
      - 'recovery/scripts/TestAudioXmaDctSnapshot.ps1'
      - 'recovery/scripts/TestAudioAiffSsnd.ps1'
      - 'recovery/scripts/TestAudioXmaWindowSnapshot.ps1'
      - 'recovery/scripts/TestAudioXmaCodecMetadata.ps1'
      - 'recovery/scripts/TestAudioXmaRawPacket.ps1'
      - 'recovery/scripts/TestAudioXmaMetadataState.ps1'
      - 'recovery/scripts/TestAudioInputMetadata.ps1'
      - 'recovery/tests/AudioXmaRawOracle.cs'
      - 'recovery/tests/AudioXmaCorpusOracle.cs'
      - 'recovery/tests/AudioXmaDispatchOracle.cs'
      - 'recovery/tests/AudioXmaNumericalDispatchOracle.cs'
      - 'recovery/tests/AudioAifcPluginOracle.cs'
      - 'recovery/tests/AudioAifcInputCases.cs'
      - 'recovery/tests/AudioAifcReaderOracle.cs'
      - 'recovery/tests/AudioAdp4Probe.cs'
      - 'recovery/tests/AudioAdp4DecoderOracle.cs'
      - 'recovery/tests/AudioAdp4PluginOracle.cs'
      - 'recovery/tests/AudioAdp4InputCases.cs'
      - 'recovery/tests/AudioAdp4ReaderOracle.cs'
      - 'recovery/tests/AudioXmaRewriteOracle.cs'
      - 'recovery/tests/AudioXmaNoiseOracle.cs'
      - 'recovery/tests/AudioXmaPcmOracle.cs'
      - 'recovery/tests/AudioXmaWindowOracle.cs'
      - 'recovery/tests/AudioXmaScheduleOracle.cs'
      - 'recovery/tests/AudioXmaFftOracle.cs'
      - 'recovery/tests/AudioXmaDctOracle.cs'
      - 'recovery/tests/AudioXmaDctSnapshotOracle.cs'
      - 'recovery/tests/AudioXmaDctSnapshotNative.cpp'
      - 'recovery/tests/AudioXmaWindowSnapshotOracle.cs'
      - 'recovery/tests/AudioXmaSnapshotNative.cpp'
      - 'recovery/tests/AudioXmaCodecMetadataOracle.cs'
      - 'recovery/tests/AudioXmaRawPacketOracle.cs'
      - 'recovery/tests/AudioXmaMetadataStateOracle.cs'
      - 'recovery/scripts/TestAudioXmaSignal.ps1'
      - 'recovery/tests/AudioXmaSignalOracle.cs'
      - 'src/AudioCompiler/Native/XmaSignalTransform.cs'
      - 'recovery/scripts/TestAudioXmaRawPacketState.ps1'
      - 'recovery/tests/AudioXmaRawPacketStateOracle.cs'
      - 'recovery/scripts/TestAudioXmaSignalSnapshot.ps1'
      - 'recovery/tests/AudioXmaSignalSnapshotOracle.cs'
      - 'recovery/tests/AudioXmaSignalSnapshotNative.cpp'
      - 'src/AudioCompiler/Native/XmaSpectralGate.cs'
      - 'recovery/scripts/TestAudioXmaSpectralGate.ps1'
      - 'recovery/tests/AudioXmaSpectralGateOracle.cs'
  workflow_dispatch:
    inputs:
      scope:
        description: components/all run isolated helpers only; SDK requires explicit formats or aifc; raw and probes collect original-only evidence
        required: true
        default: components
        type: choice
        options: [components, raw, corpus, rewrite, noise, pcm, formats, window, schedule, fft, dct, dct-state, dct-snapshot, ssnd-block, window-snapshot, dispatch, numerical-dispatch, aifc-original, aifc, adp4-probe, adp4-decoder, adp4-plugin, codec-metadata, metadata-state, raw-packet, signal, signal-state, raw-packet-state, spectral-gate, all]
permissions:
  contents: write
concurrency:
  group: audio-xma-next-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: windows-2022
    timeout-minutes: 40
    env:
      RUN_CORPUS: ${{ (github.event_name == 'workflow_dispatch' && inputs.scope == 'corpus') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[xma-corpus]')) }}
      RUN_RAW: ${{ (github.event_name == 'workflow_dispatch' && inputs.scope == 'raw') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[xma-raw]')) }}
      RUN_REWRITE: ${{ (github.event_name == 'workflow_dispatch' && (inputs.scope == 'rewrite' || inputs.scope == 'components' || inputs.scope == 'all')) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[xma-rewrite]')) }}
      RUN_NOISE: ${{ (github.event_name == 'workflow_dispatch' && (inputs.scope == 'noise' || inputs.scope == 'components' || inputs.scope == 'all')) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[xma-noise]')) }}
      RUN_WINDOW_SNAPSHOT: ${{ (github.event_name == 'workflow_dispatch' && inputs.scope == 'window-snapshot') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[xma-window-snapshot]')) }}
      RUN_DCT: ${{ (github.event_name == 'workflow_dispatch' && inputs.scope == 'dct') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[xma-dct]')) }}
      RUN_DCT_STATE: ${{ (github.event_name == 'workflow_dispatch' && (inputs.scope == 'dct-state' || inputs.scope == 'dct-snapshot')) || (github.event_name == 'push' && (contains(github.event.head_commit.message, '[xma-dct-state]') || contains(github.event.head_commit.message, '[xma-dct-snapshot]'))) }}
      RUN_SSND_BLOCK: ${{ (github.event_name == 'workflow_dispatch' && inputs.scope == 'ssnd-block') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[audio-ssnd-block]')) }}
      RUN_FFT: ${{ (github.event_name == 'workflow_dispatch' && inputs.scope == 'fft') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[xma-fft]')) }}
      RUN_SCHEDULE: ${{ (github.event_name == 'workflow_dispatch' && (inputs.scope == 'schedule' || inputs.scope == 'components' || inputs.scope == 'all')) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[xma-schedule]')) }}
      RUN_WINDOW: ${{ (github.event_name == 'workflow_dispatch' && (inputs.scope == 'window' || inputs.scope == 'components' || inputs.scope == 'all')) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[xma-window]')) }}
      RUN_PCM: ${{ (github.event_name == 'workflow_dispatch' && (inputs.scope == 'pcm' || inputs.scope == 'components' || inputs.scope == 'all')) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[xma-pcm]')) }}
      RUN_NUMERICAL_DISPATCH: ${{ (github.event_name == 'workflow_dispatch' && inputs.scope == 'numerical-dispatch') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[xma-numerical-dispatch]')) }}
      RUN_DISPATCH: ${{ (github.event_name == 'workflow_dispatch' && inputs.scope == 'dispatch') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[xma-dispatch]')) }}
      RUN_ADP4_PLUGIN: ${{ (github.event_name == 'workflow_dispatch' && inputs.scope == 'adp4-plugin') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[audio-adp4-plugin]')) }}
      RUN_ADP4_DECODER: ${{ (github.event_name == 'workflow_dispatch' && (inputs.scope == 'adp4-decoder' || inputs.scope == 'components' || inputs.scope == 'all')) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[audio-adp4-decoder]')) }}
      RUN_ADP4_PROBE: ${{ (github.event_name == 'workflow_dispatch' && inputs.scope == 'adp4-probe') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[audio-adp4-probe]')) }}
      RUN_RAW_PACKET: ${{ (github.event_name == 'workflow_dispatch' && inputs.scope == 'raw-packet') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[xma-raw-packet]')) }}
      RUN_METADATA_STATE: ${{ (github.event_name == 'workflow_dispatch' && inputs.scope == 'metadata-state') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[xma-metadata-state]')) }}
      RUN_CODEC_METADATA: ${{ (github.event_name == 'workflow_dispatch' && (inputs.scope == 'codec-metadata' || inputs.scope == 'components' || inputs.scope == 'all')) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[xma-codec-metadata]')) }}
      RUN_AIFC: ${{ (github.event_name == 'workflow_dispatch' && inputs.scope == 'aifc') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[audio-aifc]')) }}
      RUN_AIFC_ORIGINAL: ${{ (github.event_name == 'workflow_dispatch' && inputs.scope == 'aifc-original') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[audio-aifc-original]')) }}
      RUN_FORMATS: ${{ (github.event_name == 'workflow_dispatch' && inputs.scope == 'formats') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[audio-input-metadata]')) }}
      RUN_SIGNAL: ${{ (github.event_name == 'workflow_dispatch' && inputs.scope == 'signal') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[xma-signal]')) }}
      RUN_RAW_PACKET_STATE: ${{ (github.event_name == 'workflow_dispatch' && inputs.scope == 'raw-packet-state') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[xma-raw-packet-state]')) }}
      RUN_SIGNAL_STATE: ${{ (github.event_name == 'workflow_dispatch' && inputs.scope == 'signal-state') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[xma-signal-state]')) }}
      RUN_SPECTRAL_GATE: ${{ (github.event_name == 'workflow_dispatch' && inputs.scope == 'spectral-gate') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[xma-spectral-gate]')) }}
    steps:
      - uses: actions/checkout@v4
      - name: Record requested groups and verify original input
        id: preflight
        shell: pwsh
        run: |
          $out = "recovery/evidence/audio/xma-next-validation/$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          New-Item -ItemType Directory -Path $out -Force | Out-Null
          $groups = @()
          if ($env:RUN_CORPUS -eq 'true') { $groups += 'corpus' }
          if ($env:RUN_RAW -eq 'true') { $groups += 'raw' }
          if ($env:RUN_REWRITE -eq 'true') { $groups += 'rewrite' }
          if ($env:RUN_NOISE -eq 'true') { $groups += 'noise' }
          if ($env:RUN_WINDOW_SNAPSHOT -eq 'true') { $groups += 'window-snapshot' }
          if ($env:RUN_DCT -eq 'true') { $groups += 'dct' }
          if ($env:RUN_DCT_STATE -eq 'true') { $groups += 'dct-state' }
          if ($env:RUN_SSND_BLOCK -eq 'true') { $groups += 'ssnd-block' }
          if ($env:RUN_FFT -eq 'true') { $groups += 'fft' }
          if ($env:RUN_SCHEDULE -eq 'true') { $groups += 'schedule' }
          if ($env:RUN_WINDOW -eq 'true') { $groups += 'window' }
          if ($env:RUN_PCM -eq 'true') { $groups += 'pcm' }
          if ($env:RUN_NUMERICAL_DISPATCH -eq 'true') { $groups += 'numerical-dispatch' }
          if ($env:RUN_DISPATCH -eq 'true') { $groups += 'dispatch' }
          if ($env:RUN_ADP4_PLUGIN -eq 'true') { $groups += 'adp4-plugin' }
          if ($env:RUN_ADP4_DECODER -eq 'true') { $groups += 'adp4-decoder' }
          if ($env:RUN_ADP4_PROBE -eq 'true') { $groups += 'adp4-probe' }
          if ($env:RUN_RAW_PACKET -eq 'true') { $groups += 'raw-packet' }
          if ($env:RUN_METADATA_STATE -eq 'true') { $groups += 'metadata-state' }
          if ($env:RUN_CODEC_METADATA -eq 'true') { $groups += 'codec-metadata' }
          if ($env:RUN_AIFC -eq 'true') { $groups += 'aifc' }
          if ($env:RUN_AIFC_ORIGINAL -eq 'true') { $groups += 'aifc-original' }
          if ($env:RUN_FORMATS -eq 'true') { $groups += 'formats' }
          if ($env:RUN_SIGNAL -eq 'true') { $groups += 'signal' }
          if ($env:RUN_RAW_PACKET_STATE -eq 'true') { $groups += 'raw-packet-state' }
          if ($env:RUN_SIGNAL_STATE -eq 'true') { $groups += 'signal-state' }
          if ($env:RUN_SPECTRAL_GATE -eq 'true') { $groups += 'spectral-gate' }
          $state = @{
            sourceCommit = (git rev-parse HEAD).Trim()
            runId = $env:GITHUB_RUN_ID
            runAttempt = $env:GITHUB_RUN_ATTEMPT
            requestedGroups = @($groups)
            rawEvidenceIsOriginalOnly = $true
            xmaEncoderRecovered = $false
            originalSha256 = (Get-FileHash 'SDK/tools/BinaryAssetBuilder.AudioCompiler.dll').Hash.ToLowerInvariant()
          }
          $state | ConvertTo-Json -Depth 6 | Set-Content "$out/request.json"
          if ($env:RUN_SSND_BLOCK -eq 'true' -and ($env:RUN_FORMATS -eq 'true' -or $env:RUN_AIFC -eq 'true' -or $env:RUN_AIFC_ORIGINAL -eq 'true' -or $env:RUN_ADP4_PLUGIN -eq 'true')) { throw 'SSND component group must run separately from other input groups that share evidence directories' }
          if ($env:RUN_ADP4_PLUGIN -eq 'true' -and ($env:RUN_FORMATS -eq 'true' -or $env:RUN_AIFC -eq 'true' -or $env:RUN_AIFC_ORIGINAL -eq 'true')) { throw 'ADP4 plugin component group must run separately from formats/AIFC groups that share evidence directories' }
          if ($env:RUN_AIFC -eq 'true' -and ($env:RUN_FORMATS -eq 'true' -or $env:RUN_AIFC_ORIGINAL -eq 'true')) { throw 'AIFC full acceptance must run separately from formats and AIFC original-only to preserve distinct evidence directories' }
          if ($groups.Count -eq 0) { throw 'Select explicit [xma-raw], [xma-corpus], [xma-rewrite], [xma-noise], [xma-pcm], [xma-window], [xma-schedule], [xma-fft], [xma-dct], [xma-dct-state], [xma-dct-snapshot], [audio-ssnd-block], [xma-window-snapshot], [xma-dispatch], [xma-numerical-dispatch], [audio-input-metadata], [audio-aifc], [audio-aifc-original], [audio-adp4-probe], [audio-adp4-decoder], [audio-adp4-plugin], [xma-codec-metadata], [xma-metadata-state], [xma-raw-packet], [xma-signal], or [xma-raw-packet-state], or [xma-signal-state], or [xma-spectral-gate] push markers, or dispatch a scope' }
          if ($state.originalSha256 -ne 'a14d15addef502c2df6f6ba272d6098c4c131fbea9c3ed0149c11c4556347139') { throw 'Original AudioCompiler DLL fingerprint changed' }
      - uses: actions/setup-dotnet@v4
        if: env.RUN_FORMATS == 'true' || env.RUN_AIFC == 'true' || env.RUN_ADP4_PLUGIN == 'true' || env.RUN_SSND_BLOCK == 'true'
        with:
          dotnet-version: '8.0.x'
      - uses: ilammy/msvc-dev-cmd@v1
        if: env.RUN_WINDOW_SNAPSHOT == 'true' || env.RUN_DCT_STATE == 'true' || env.RUN_SIGNAL_STATE == 'true'
        with:
          arch: x86
      - name: Collect original raw XMA output before packet rewriting
        if: always() && steps.preflight.outcome == 'success' && env.RUN_RAW == 'true'
        shell: pwsh
        run: "& './recovery/scripts/TestAudioXmaRaw.ps1'"
      - name: Collect deterministic original long and real-audio XMA corpus
        if: always() && steps.preflight.outcome == 'success' && env.RUN_CORPUS == 'true'
        shell: pwsh
        run: "& './recovery/scripts/TestAudioXmaCorpus.ps1'"
      - name: Compare original CPU and Debug/Release packet rewriting
        if: always() && steps.preflight.outcome == 'success' && env.RUN_REWRITE == 'true'
        shell: pwsh
        run: |
          $raw = "recovery/evidence/audio/xma-raw-validation/$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          if ($env:RUN_RAW -eq 'true') {
            if (!(Test-Path "$raw/validation.json")) { throw 'Requested raw capture did not produce a receipt' }
            $receipt = Get-Content "$raw/validation.json" -Raw | ConvertFrom-Json
            if ($receipt.status -ne 'original-evidence-only') { throw 'Requested raw capture did not finish successfully' }
          } else {
            # Immutable original-only evidence; its sourceCommit/runId and
            # content hashes are checked and retained by the rewrite harness.
            $raw = 'recovery/evidence/audio/xma-raw-validation/40232525056-1'
          }
          & './recovery/scripts/TestAudioXmaRewrite.ps1' -RawEvidenceDirectory $raw
      - name: Compare original CPU and Debug/Release numerical noise helpers
        if: always() && steps.preflight.outcome == 'success' && env.RUN_NOISE == 'true'
        shell: pwsh
        run: "& './recovery/scripts/TestAudioXmaNoise.ps1'"
      - name: Compare original CPU and Debug/Release PCM preconversion
        if: always() && steps.preflight.outcome == 'success' && env.RUN_PCM == 'true'
        shell: pwsh
        run: "& './recovery/scripts/TestAudioXmaPcm.ps1'"
      - name: Compare original CPU and Debug/Release PCM window leaves
        if: always() && steps.preflight.outcome == 'success' && env.RUN_WINDOW == 'true'
        shell: pwsh
        run: "& './recovery/scripts/TestAudioXmaWindow.ps1'"
      - name: Capture bounded actual codec window inputs with native FPU preservation
        if: always() && steps.preflight.outcome == 'success' && env.RUN_WINDOW_SNAPSHOT == 'true'
        shell: pwsh
        run: "& './recovery/scripts/TestAudioXmaWindowSnapshot.ps1'"
      - name: Compare original CPU and Debug/Release PCM window scheduler
        if: always() && steps.preflight.outcome == 'success' && env.RUN_SCHEDULE == 'true'
        shell: pwsh
        run: |
          if ($env:RUN_WINDOW_SNAPSHOT -eq 'true') {
            $capture = "recovery/evidence/audio/xma-window-snapshot-validation/$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
            $receipt = Get-Content "$capture/validation.json" -Raw | ConvertFrom-Json
            if ($receipt.status -ne 'original-evidence-only' -or $receipt.tracedCases -ne 2 -or $receipt.snapshots -le 0) { throw 'Requested actual window capture did not complete' }
            & './recovery/scripts/TestAudioXmaSchedule.ps1' -SnapshotsDirectory "$capture/windows"
          } else {
            & './recovery/scripts/TestAudioXmaSchedule.ps1'
          }
      - name: Compare original CPU and Debug/Release bounded XMA complex FFT
        if: always() && steps.preflight.outcome == 'success' && env.RUN_FFT == 'true'
        shell: pwsh
        run: "& './recovery/scripts/TestAudioXmaFft.ps1'"
      - name: Capture actual original DCT inputs and outputs with native FPU preservation
        if: always() && steps.preflight.outcome == 'success' && env.RUN_DCT_STATE == 'true'
        shell: pwsh
        run: "& './recovery/scripts/TestAudioXmaDctSnapshot.ps1'"
      - name: Compare original CPU and Debug/Release table-backed XMA DCT
        if: always() && steps.preflight.outcome == 'success' && env.RUN_DCT == 'true'
        shell: pwsh
        run: |
          if ($env:RUN_DCT_STATE -eq 'true') {
            $capture = "recovery/evidence/audio/xma-dct-snapshot-validation/$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
            $receipt = Get-Content "$capture/validation.json" -Raw | ConvertFrom-Json
            if ($receipt.status -ne 'original-evidence-only' -or $receipt.tracedCases -ne 2 -or $receipt.snapshots -le 0) { throw 'Requested actual DCT capture did not complete' }
            & './recovery/scripts/TestAudioXmaDct.ps1' -SnapshotsDirectory "$capture/transforms"
          } else {
            & './recovery/scripts/TestAudioXmaDct.ps1'
          }
      - name: Compare SSND block-size behavior without SDK
        if: always() && steps.preflight.outcome == 'success' && env.RUN_SSND_BLOCK == 'true'
        shell: pwsh
        run: "& './recovery/scripts/TestAudioAiffSsnd.ps1'"
      - name: Compare input metadata group and real SDK products
        if: always() && steps.preflight.outcome == 'success' && env.RUN_FORMATS == 'true'
        shell: pwsh
        run: "& './recovery/scripts/TestAudioInputMetadata.ps1'"
      - name: Trace original XMA codec dispatch targets
        if: always() && steps.preflight.outcome == 'success' && env.RUN_DISPATCH == 'true'
        shell: pwsh
        run: "& './recovery/scripts/TestAudioXmaDispatch.ps1'"
      - name: Trace original numerical XMA callback target
        if: always() && steps.preflight.outcome == 'success' && env.RUN_NUMERICAL_DISPATCH == 'true'
        shell: pwsh
        run: "& './recovery/scripts/TestAudioXmaNumericalDispatch.ps1'"
      - name: Collect original AIFC acceptance evidence
        if: always() && steps.preflight.outcome == 'success' && env.RUN_AIFC_ORIGINAL == 'true'
        shell: pwsh
        run: "& './recovery/scripts/TestAudioAifc.ps1' -OriginalOnly"
      - name: Compare complete AIFC group and affected AIFF/WAVE regressions
        if: always() && steps.preflight.outcome == 'success' && env.RUN_AIFC == 'true'
        shell: pwsh
        run: |
          & './recovery/scripts/TestAudioPlugin.ps1' -Groups @('formats', 'aiffloops')
          & './recovery/scripts/TestAudioAifc.ps1'
      - name: Collect original ADP4 acceptance and frame-count evidence
        if: always() && steps.preflight.outcome == 'success' && env.RUN_ADP4_PROBE == 'true'
        shell: pwsh
        run: "& './recovery/scripts/TestAudioAdp4Probe.ps1'"
      - name: Compare original CPU and Debug/Release ADP4 decoder component
        if: always() && steps.preflight.outcome == 'success' && env.RUN_ADP4_DECODER == 'true'
        shell: pwsh
        run: "& './recovery/scripts/TestAudioAdp4Decoder.ps1'"
      - name: Compare ADP4 plugin group and affected inputs without SDK
        if: always() && steps.preflight.outcome == 'success' && env.RUN_ADP4_PLUGIN == 'true'
        shell: pwsh
        run: |
          & './recovery/scripts/TestAudioPlugin.ps1' -Groups @('formats', 'aiffloops')
          & './recovery/scripts/TestAudioAifc.ps1' -SkipSdk
          & './recovery/scripts/TestAudioAdp4Plugin.ps1'
      - name: Compare original CPU and Debug/Release XMA codec metadata
        if: always() && steps.preflight.outcome == 'success' && env.RUN_CODEC_METADATA == 'true'
        shell: pwsh
        run: "& './recovery/scripts/TestAudioXmaCodecMetadata.ps1'"
      - name: Capture actual codec states and compare recovered metadata
        if: always() && steps.preflight.outcome == 'success' && env.RUN_METADATA_STATE == 'true'
        shell: pwsh
        run: "& './recovery/scripts/TestAudioXmaMetadataState.ps1'"
      - name: Compare original CPU and Debug/Release raw XMA packet lifecycle
        if: always() && steps.preflight.outcome == 'success' && env.RUN_RAW_PACKET == 'true'
        shell: pwsh
        run: "& './recovery/scripts/TestAudioXmaRawPacket.ps1'"
      - name: Capture actual original complete signal inputs and outputs
        if: always() && steps.preflight.outcome == 'success' && env.RUN_SIGNAL_STATE == 'true'
        shell: pwsh
        run: "& './recovery/scripts/TestAudioXmaSignalSnapshot.ps1'"
      - name: Compare complete signal transform against original CPU and isolated candidates
        if: always() && steps.preflight.outcome == 'success' && (env.RUN_SIGNAL == 'true' || env.RUN_SIGNAL_STATE == 'true')
        shell: pwsh
        run: |
          if ($env:RUN_SIGNAL_STATE -eq 'true') {
            $capture = "recovery/evidence/audio/xma-signal-snapshot-validation/$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
            $receipt = Get-Content "$capture/validation.json" -Raw | ConvertFrom-Json
            if ($receipt.status -ne 'original-evidence-only' -or $receipt.tracedCases -ne 2 -or $receipt.snapshots -le 0) { throw 'Requested actual signal capture did not complete' }
            if ($env:RUN_SIGNAL -eq 'true') {
              & './recovery/scripts/TestAudioXmaSignal.ps1' -SnapshotsDirectory "$capture/signals"
            } else {
              & './recovery/scripts/TestAudioXmaSignal.ps1' -SnapshotsDirectory "$capture/signals" -RealOnly
            }
          } else {
            & './recovery/scripts/TestAudioXmaSignal.ps1'
          }
      - name: Capture actual raw packet states and replay isolated recovered lifecycle
        if: always() && steps.preflight.outcome == 'success' && env.RUN_RAW_PACKET_STATE == 'true'
        shell: pwsh
        run: "& './recovery/scripts/TestAudioXmaRawPacketState.ps1'"
      - name: Compare optional XMA spectral attenuation against original CPU
        if: always() && steps.preflight.outcome == 'success' && env.RUN_SPECTRAL_GATE == 'true'
        shell: pwsh
        run: "& './recovery/scripts/TestAudioXmaSpectralGate.ps1'"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audio-xma-next-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          path: |
            recovery/evidence/audio/xma-signal-validation/${{ github.run_id }}-${{ github.run_attempt }}
            recovery/evidence/audio/xma-raw-packet-state-validation/${{ github.run_id }}-${{ github.run_attempt }}
            recovery/evidence/audio/xma-signal-snapshot-validation/${{ github.run_id }}-${{ github.run_attempt }}
            recovery/evidence/audio/xma-signal-replay-validation/${{ github.run_id }}-${{ github.run_attempt }}
