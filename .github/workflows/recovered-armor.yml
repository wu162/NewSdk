name: Recovered ArmorTemplate differential test
on:
  push:
    branches: [recovery/compiler-source]
    paths:
      - '.github/workflows/recovered-armor.yml'
      - 'recovery/src/Native/ArmorTemplate.*'
      - 'recovery/src/Native/ScalarParsing.*'
      - 'recovery/src/Bridge/ArmorCompiler.cpp'
      - 'recovery/src/Bridge/XmlNodeAdapter.h'
      - 'recovery/tests/ArmorOracle.cs'
      - 'recovery/tests/XmlNodeOracle.cs'
      - 'recovery/tests/ScalarOracle.cs'
      - 'recovery/scripts/TestArmor.ps1'
permissions:
  contents: write
jobs:
  differential:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86
      - name: Build serializer and compare original ProcessInstance
        shell: pwsh
        run: ./recovery/scripts/TestArmor.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recovered-armor-oracle
          path: recovery/evidence/armor
      - name: Save differential result
        if: always()
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add recovery/evidence/armor
          if (git diff --cached --quiet) { exit 0 }
          git commit -m 'recovery: record ArmorTemplate ProcessInstance differential results'
          git pull --rebase origin recovery/compiler-source
          git push origin HEAD:recovery/compiler-source
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: recovered-armor-component-x86
          path: ${{ runner.temp }}/ra3-recovered-armor/Recovered.Armor.dll
