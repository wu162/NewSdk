name: Accepted P7 runtime P6 release refresh
on:
  push:
    branches: [refactor/modcompiler-p0-p3]
    paths:
      - '.github/workflows/refactor-release.yml'
      - 'recovery/scripts/PrepareCompilerRelease.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: refactor-release-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false
jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[refactor-release]')
    runs-on: windows-2022
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/recovery/evidence/
      - name: Measure original SDK echo version bytes before release preparation
        shell: pwsh
        run: |
          $out="recovery/artifacts/legacy-version-probe/$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          New-Item -ItemType Directory -Path $out|Out-Null
          $work=Join-Path $env:RUNNER_TEMP ('v'+[Guid]::NewGuid().ToString('N').Substring(0,8))
          New-Item -ItemType Directory -Path (Join-Path $work 'aptui')|Out-Null
          [IO.File]::WriteAllText((Join-Path $work 'probe.xml'),'fixture')
          [IO.File]::WriteAllText((Join-Path $work 'aptui/probe.manifest'),'fixture')
          $legacy=Get-Content -LiteralPath SDK/defaultscript.cs -Raw
          $producer=Get-Content -LiteralPath recovery/src/App/Application/BigPackage.cs -Raw
          if(!$legacy.Contains('(echo. >') -or !$producer.Contains('file.WriteByte(32);file.WriteByte(13);file.WriteByte(10);')){throw 'Version-byte probe no longer matches the exact reviewed SDK and production source'}
          $command='(@echo off) & (for %I in ("'+$work+'\probe.xml") do ((if exist "'+$work+'\aptui\%~nI.manifest" (echo. >"'+$work+'\aptui\%~nI.version"))))'
          $start=[Diagnostics.ProcessStartInfo]::new()
          $start.FileName=Join-Path $env:windir 'System32/cmd.exe';$start.Arguments='/C '+$command
          $start.WorkingDirectory=$work;$start.UseShellExecute=$false;$start.CreateNoWindow=$true
          $start.RedirectStandardOutput=$true;$start.RedirectStandardError=$true
          $process=[Diagnostics.Process]::new();$process.StartInfo=$start
          try {
            if(!$process.Start()){throw 'Original cmd version probe did not start'}
            $stdout=$process.StandardOutput.ReadToEndAsync();$stderr=$process.StandardError.ReadToEndAsync()
            if(!$process.WaitForExit(10000)){$process.Kill($true);throw 'Original cmd version probe timed out'}
            [IO.File]::WriteAllText((Join-Path $out 'stdout.log'),$stdout.GetAwaiter().GetResult())
            [IO.File]::WriteAllText((Join-Path $out 'stderr.log'),$stderr.GetAwaiter().GetResult())
            $version=Join-Path $work 'aptui/probe.version'
            [byte[]]$bytes=@();if(Test-Path -LiteralPath $version){$bytes=[IO.File]::ReadAllBytes($version)}
            [IO.File]::WriteAllBytes((Join-Path $out 'original.version'),[byte[]]$bytes)
            $matches=($process.ExitCode -eq 0 -and $bytes.Length -eq 3 -and $bytes[0] -eq 32 -and $bytes[1] -eq 13 -and $bytes[2] -eq 10)
            @{schemaVersion=1;sourceCommit=(git rev-parse HEAD).Trim();binarySourceCommit='828fead203f38a4599c98fb9fe93290acc271b96';runId=$env:GITHUB_RUN_ID;runAttempt=$env:GITHUB_RUN_ATTEMPT;sourceScript='SDK/defaultscript.cs';sourceScriptSha256=(Get-FileHash SDK/defaultscript.cs -Algorithm SHA256).Hash.ToLowerInvariant();originalCommand=$command;originalExitCode=$process.ExitCode;actualBytes=@($bytes);actualHex=([Convert]::ToHexString([byte[]]$bytes)).ToLowerInvariant();expectedProductionBytes=@(32,13,10);matchesCurrentProduction=$matches;scope='Exact original SDK echo-dot space redirection command measured by Windows cmd, before any release preparation'}|ConvertTo-Json -Depth 5|Set-Content (Join-Path $out 'receipt.json')
            if(!$matches){throw 'Original SDK version marker bytes differ from the current production marker; release refresh blocked (see legacy-version-probe receipt)'}
          } finally {$process.Dispose();if(Test-Path -LiteralPath $work){Remove-Item -LiteralPath $work -Recurse -Force}}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Install pinned release protocol dependencies
        shell: pwsh
        run: python -m pip install -r recovery/scripts/app-protocol-requirements.txt
      - name: Prepare exact accepted P7 bytes and retain historical SDK scope
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python recovery/scripts/PrepareCompilerRelease.py --repo . --candidate-commit $env:GITHUB_SHA --output recovery/artifacts/release-product --archive "$env:RUNNER_TEMP/release-product.zip" --sdk-archive "$env:RUNNER_TEMP/accepted-mymod.zip"
          if($LASTEXITCODE -ne 0){throw 'Accepted P7 release preparation rejected'}
      - name: Package and verify the five-file runtime deployment
        shell: pwsh
        run: |
          ./recovery/scripts/PublishCompiler.ps1 -CompilerDirectory recovery/artifacts/release-product -AcceptanceReceipt recovery/artifacts/release-product/accepted-cli.json -OutputDirectory "recovery/artifacts/release-refresh/$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          if($LASTEXITCODE -ne 0){throw 'P7 release ZIP deployment validation failed'}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: refactor-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            recovery/artifacts/legacy-version-probe/${{ github.run_id }}-${{ github.run_attempt }}
            recovery/artifacts/release-refresh/${{ github.run_id }}-${{ github.run_attempt }}
            recovery/artifacts/release-product/release-preparation.json
            recovery/artifacts/release-product/accepted-cli.json
            recovery/artifacts/release-product/accepted-mymod.json
            recovery/artifacts/release-product/acceptance/**
