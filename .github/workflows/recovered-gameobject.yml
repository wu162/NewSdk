# AGENTS.md explicitly authorizes Actions configuration and automatic evidence pushes.
# This change only adds ObjectFilter to the existing path filter; permissions and push steps are unchanged.
name: GameObject root recovery validation
on:
  push:
    branches: [recovery/compiler-source]
    paths:
      - '.github/workflows/recovered-gameobject.yml'
      - 'recovery/src/**/GameObject*'
      - 'recovery/src/**/ObjectFilter*'
      - 'recovery/src/**/WeaponSlotOrder*'
      - 'recovery/src/**/Relocation*'
      - 'recovery/src/**/ScalarParsing*'
      - 'recovery/src/**/DataInitializers*'
      - 'recovery/src/**/ResourceMarshaling*'
      - 'recovery/src/**/EnumBitset*'
      - 'recovery/scripts/TestGameObject.ps1'
      - 'recovery/scripts/PublishGameObjectEvidence.ps1'
      - 'recovery/scripts/GenerateGameObjectFields.py'
      - 'recovery/scripts/GenerateSpecialPowerBaseFields.py'
      - 'recovery/scripts/GenerateSpecialPowerDerivedFields.py'
      - 'recovery/scripts/GeneratePowerRoutingFields.py'
      - 'recovery/scripts/GenerateSpecialAbilityFields.py'
      - 'recovery/scripts/GenerateAbilityToggleFields.py'
      - 'recovery/scripts/ExportAbilityToggleMethods.py'
      - 'recovery/scripts/GenerateAbilityResourceFields.py'
      - 'recovery/scripts/ExportAbilityResourceMethods.py'
      - 'recovery/scripts/GenerateAbilityRoutingFields.py'
      - 'recovery/scripts/ExportAbilityRoutingMethods.py'
      - 'recovery/scripts/GenerateAbilityStateFields.py'
      - 'recovery/scripts/ExportAbilityStateMethods.py'
      - 'recovery/scripts/GenerateAbilityMovementFields.py'
      - 'recovery/scripts/ExportAbilityMovementMethods.py'
      - 'recovery/scripts/GenerateAbilityWeaponFields.py'
      - 'recovery/scripts/ExportAbilityWeaponMethods.py'
      - 'recovery/scripts/GeneratePowerCreationFields.py'
      - 'recovery/scripts/ExportPowerCreationMethods.py'
      - 'recovery/scripts/GenerateUpgradeRemaining.py'
      - 'recovery/scripts/GenerateProductionFields.py'
      - 'recovery/scripts/GenerateCreateFields.py'
      - 'recovery/scripts/GenerateSlavedFields.py'
      - 'recovery/scripts/GenerateTechReceiverFields.py'
      - 'recovery/scripts/GenerateVisionFields.py'
      - 'recovery/scripts/GenerateWeaponBehaviorFields.py'
      - 'recovery/scripts/GenerateBeamStateFields.py'
      - 'recovery/scripts/GenerateMotionFields.py'
      - 'recovery/scripts/GenerateFlightFields.py'
      - 'recovery/scripts/GenerateReactiveFields.py'
      - 'recovery/scripts/GenerateWeaponSetFields.py'
      - 'recovery/scripts/GenerateHealingFields.py'
      - 'recovery/scripts/GenerateCrateFields.py'
      - 'recovery/scripts/GenerateAIUpdateFields.py'
      - 'recovery/scripts/ExtractGameObjectEvidence.py'
      - 'recovery/scripts/ExtractGameObjectModuleEvidence.py'
      - 'recovery/tests/GameObject*.cs'
      - 'recovery/tests/GameObjectOracle.cs'
      - 'recovery/tests/GameObjectCases.cs'
      - 'recovery/tests/GameObjectKindOf.cs'
      - 'recovery/tests/GameObjectWeaponSetCases.cs'
      - 'recovery/tests/GameObjectHealingCases.cs'
      - 'recovery/tests/GameObjectCrateCases.cs'
      - 'recovery/tests/GameObjectAIUpdateCases.cs'
permissions:
  contents: write
jobs:
  differential:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86
      - name: Compare original and recovered GameObject root
        shell: pwsh
        run: ./recovery/scripts/TestGameObject.ps1
      - name: Persist root component evidence
        if: always()
        shell: pwsh
        run: ./recovery/scripts/PublishGameObjectEvidence.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recovered-gameobject-root
          path: recovery/evidence/gameobject-root
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: recovered-gameobject-component-x86
          path: ${{ runner.temp }}/ra3-recovered-gameobject/Recovered.GameObject.dll








