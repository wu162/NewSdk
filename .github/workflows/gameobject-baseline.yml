name: Original GameObject characterization
on:
  push:
    branches: [recovery/compiler-source]
    paths:
      - '.github/workflows/gameobject-baseline.yml'
      - 'recovery/scripts/TestGameObjectBaseline.ps1'
      - 'recovery/scripts/ExtractGameObjectEvidence.py'
      - 'recovery/tests/GameObjectBaseline.cs'
permissions:
  contents: write
jobs:
  original-baseline:
    runs-on: windows-2022
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Capture original GameObject behavior
        shell: pwsh
        run: ./recovery/scripts/TestGameObjectBaseline.ps1
      - name: Persist characterization evidence
        if: always()
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add recovery/evidence/gameobject
          if ($LASTEXITCODE -ne 0) { throw 'Unable to stage characterization evidence' }
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { exit 0 }
          if ($LASTEXITCODE -ne 1) { throw 'Unable to inspect characterization evidence' }
          git commit -m "recovery: record original GameObject baseline for $env:GITHUB_SHA"
          if ($LASTEXITCODE -ne 0) { throw 'Evidence commit failed' }
          git pull --rebase origin recovery/compiler-source
          if ($LASTEXITCODE -ne 0) { throw 'Evidence rebase failed' }
          git push origin HEAD:recovery/compiler-source
          if ($LASTEXITCODE -ne 0) { throw 'Evidence push failed' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-gameobject-baseline
          path: recovery/evidence/gameobject
