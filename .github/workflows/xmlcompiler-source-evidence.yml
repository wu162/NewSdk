name: Export bounded XmlCompiler original source
on:
  push:
    branches: [recovery/xmlcompiler-priority]
    paths:
      - '.github/workflows/xmlcompiler-source-evidence.yml'
      - 'recovery/scripts/ExportXmlCompilerSource.py'
permissions:
  contents: write
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify and split pinned original source
        run: python3 recovery/scripts/ExportXmlCompilerSource.py
      - uses: actions/upload-artifact@v4
        with:
          name: xmlcompiler-original-source
          path: recovery/evidence/xml-source
      - name: Save original evidence
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add recovery/evidence/xml-source
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "recovery: export pinned XmlCompiler original source evidence"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
