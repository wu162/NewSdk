name: Recovered relocation runtime differential test
on:
  push:
    branches: [recovery/compiler-source]
    paths:
      - '.github/workflows/recovered-relocation.yml'
      - 'recovery/src/Native/Relocation.*'
      - 'recovery/src/Bridge/RelocationBridge.cpp'
      - 'recovery/tests/RelocationOracle.cs'
      - 'recovery/scripts/TestRelocation.ps1'
permissions:
  contents: write
jobs:
  differential:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86
      - name: Build runtime and compare both original DLLs
        shell: pwsh
        run: ./recovery/scripts/TestRelocation.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recovered-relocation-oracle
          path: recovery/evidence/relocation
      - name: Save differential result
        if: always()
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add recovery/evidence/relocation
          if (git diff --cached --quiet) { exit 0 }
          git commit -m 'recovery: record relocation runtime differential results'
          git pull --rebase origin recovery/compiler-source
          git push origin HEAD:recovery/compiler-source
