name: Prepare compiler runtime package for user review
on:
  push:
    branches: [release/compiler-2026.11.01-harness]
    paths: ['.github/workflows/compiler-review-package.yml', '.github/scripts/**']
permissions:
  contents: read
  actions: read
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: .github
      - name: Require completed successful final acceptance
        uses: actions/github-script@v7
        with:
          script: |
            const {data: run} = await github.rest.actions.getWorkflowRun({...context.repo, run_id: 41297316677});
            if (run.status !== 'completed' || run.conclusion !== 'success') throw new Error('Final acceptance must succeed before packaging');
      - uses: actions/download-artifact@v4
        with:
          name: compiler-release-final-41297316677-1
          github-token: ${{ github.token }}
          run-id: 41297316677
          path: work/acceptance
      - name: Check exact binaries receipts CRC and SHA256 then prepare source-free review files
        run: |
          python .github/scripts/audit_compiler_release.py --artifact work/acceptance --assets work/review-package --commit 680c4f0c4439bd7435addebfc57a1a16c3c320e3 --run 41297316677 --tag compiler-2026.11.01 --binary-build-run 41295495489 --replay-run 41296844301 --xml-run 41297071528
          cp .github/scripts/USAGE.zh-CN.md work/review-package/
          python - <<'PY'
          import hashlib
          from pathlib import Path
          root = Path('work/review-package')
          names = sorted(p.name for p in root.iterdir())
          assert len(names) == 6
          (root/'SHA256SUMS.txt').write_text(''.join(hashlib.sha256((root/name).read_bytes()).hexdigest()+'  '+name+'\n' for name in names), encoding='utf-8')
          print('\n'.join(sorted(p.name for p in root.iterdir())))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: NewModCompiler-2026.11.01-review
          path: work/review-package/*
          if-no-files-found: error
