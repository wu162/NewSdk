name: Strict targeted runtime reuse
on:
  push:
    branches: ['feature/compiler-optimization']
    paths:
      - '.github/workflows/refactor-targeted-reuse.yml'
      - 'recovery/scripts/DownloadCompilerTargetedReuse.py'
      - 'recovery/scripts/TestCompilerTargetedReuse.py'
      - 'recovery/scripts/ExportCompilerAcceptedRelease.py'
      - 'recovery/scripts/TestCompilerAcceptedRelease.py'
      - 'recovery/scripts/TestCompilerCoreLifecycle.ps1'
      - 'recovery/tests/Compiler*.cs'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: targeted-runtime-reuse-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false
jobs:
  controller-contracts:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[compiler-targeted-reuse]') || contains(github.event.head_commit.message, '[targeted-reuse-contracts]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /recovery/scripts/*.py
      - name: Check source-closure and unchanged-package transport contracts
        run: |
          python recovery/scripts/TestCompilerTargetedReuse.py --output recovery/artifacts/targeted-reuse-controller/validation.json
          python recovery/scripts/TestCompilerAcceptedRelease.py --output recovery/artifacts/accepted-release-controller/validation.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compiler-reuse-contracts-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            recovery/artifacts/targeted-reuse-controller/validation.json
            recovery/artifacts/accepted-release-controller/validation.json
          if-no-files-found: error
  targeted:
    needs: controller-contracts
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[compiler-targeted-reuse]')
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/recovery/evidence/
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86
      - name: Install pinned evidence and runtime audit dependencies
        shell: pwsh
        run: python -m pip install -r recovery/probes/TextureRedirect/requirements.txt -r recovery/scripts/app-protocol-requirements.txt lxml==6.0.2
      - name: Check strict reuse closure and original release export contracts
        shell: pwsh
        run: |
          python recovery/scripts/ValidateCompilerUpheavalSamples.py --output recovery/artifacts/upheaval-small-preflight/validation.json
          if($LASTEXITCODE -ne 0){throw 'Bounded Upheaval source-byte/input-closure preflight failed'}
          python recovery/scripts/TestCompilerTargetedReuse.py --output recovery/artifacts/targeted-reuse-controller/validation.json
          if($LASTEXITCODE -ne 0){throw 'Strict reuse controller contracts failed'}
          python recovery/scripts/TestCompilerAcceptedRelease.py --output recovery/artifacts/accepted-release-controller/validation.json
          if($LASTEXITCODE -ne 0){throw 'Accepted release transport contracts failed'}
      - name: Verify accepted source closure and stage exact runtime bytes
        id: reuse
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python recovery/scripts/DownloadCompilerTargetedReuse.py --repo . --candidate-commit $env:GITHUB_SHA --output recovery/artifacts/targeted-reuse-product --archive "$env:RUNNER_TEMP/targeted-reuse.zip"
          if($LASTEXITCODE -ne 0){throw 'Strict targeted runtime reuse rejected'}
          $receipt=Get-Content recovery/artifacts/targeted-reuse-product/reuse.json -Raw|ConvertFrom-Json
          "sourceRunId=$($receipt.sourceRunId)"|Add-Content $env:GITHUB_OUTPUT
      - name: Export the unchanged accepted five-file ZIP packages
        id: release
        if: ${{ !cancelled() && steps.reuse.outcome == 'success' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python recovery/scripts/ExportCompilerAcceptedRelease.py --archive "$env:RUNNER_TEMP/targeted-reuse.zip" --reuse-receipt recovery/artifacts/targeted-reuse-product/reuse.json --compiler-directory recovery/artifacts/targeted-reuse-product --output recovery/artifacts/accepted-release
          if($LASTEXITCODE -ne 0){throw 'Original accepted release export rejected'}
      - name: Run current targeted fixtures against verified production objects
        id: lifecycle
        if: ${{ !cancelled() && steps.reuse.outcome == 'success' }}
        shell: pwsh
        run: |
          ./recovery/scripts/TestCompilerCoreLifecycle.ps1 -CompilerDirectory recovery/artifacts/targeted-reuse-product -ReuseReceipt recovery/artifacts/targeted-reuse-product/reuse.json -OutputDirectory "recovery/evidence/refactor/targeted-reuse/$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
      - name: Compare current selected inputs with independent original BAB processes
        if: ${{ !cancelled() && steps.lifecycle.outcome == 'success' }}
        shell: pwsh
        run: |
          foreach($mode in @('Debug','Release')) {
            ./recovery/scripts/TestCompilerBackendBaseline.ps1 -FixtureResult "recovery/evidence/refactor/targeted-reuse/$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT/$mode/CompilerBackendLifecycle/result.json" -OutputDirectory "recovery/evidence/refactor/reuse-backend-baseline/$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT/$mode" -TimeoutSeconds 180
            ./recovery/scripts/TestCompilerBackendBaseline.ps1 -FixtureResult "recovery/evidence/refactor/targeted-reuse/$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT/$mode/CompilerUpheavalSamples/result.json" -OutputDirectory "recovery/evidence/refactor/reuse-upheaval-baseline/$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT/$mode" -ExpectedCaseCount 1 -TimeoutSeconds 180
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compiler-targeted-reuse-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            recovery/artifacts/targeted-reuse-controller/validation.json
            recovery/artifacts/accepted-release-controller/validation.json
            recovery/artifacts/targeted-reuse-product/reuse.json
            recovery/artifacts/accepted-release/export-receipt.json
            recovery/artifacts/upheaval-small-preflight/validation.json
            recovery/evidence/refactor/targeted-reuse/${{ github.run_id }}-${{ github.run_attempt }}/validation.json
            recovery/evidence/refactor/targeted-reuse/${{ github.run_id }}-${{ github.run_attempt }}/**/result.json
            recovery/evidence/refactor/targeted-reuse/${{ github.run_id }}-${{ github.run_attempt }}/**/fixture-build.log
            recovery/evidence/refactor/targeted-reuse/${{ github.run_id }}-${{ github.run_attempt }}/**/runtime.log
            recovery/evidence/refactor/targeted-reuse/${{ github.run_id }}-${{ github.run_attempt }}/**/protocol/*/build-report.json
            recovery/evidence/refactor/targeted-reuse/${{ github.run_id }}-${{ github.run_attempt }}/expression-original/**
            recovery/evidence/refactor/targeted-reuse/${{ github.run_id }}-${{ github.run_attempt }}/document-original/**
            recovery/evidence/refactor/targeted-reuse/${{ github.run_id }}-${{ github.run_attempt }}/upheaval-small-inputs/**
            recovery/evidence/refactor/reuse-backend-baseline/${{ github.run_id }}-${{ github.run_attempt }}/**/validation.json
            recovery/evidence/refactor/reuse-upheaval-baseline/${{ github.run_id }}-${{ github.run_attempt }}/**/validation.json
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.release.outcome == 'success' }}
        with:
          name: compiler-accepted-release-Debug-${{ steps.reuse.outputs.sourceRunId }}-${{ github.run_id }}
          path: |
            recovery/artifacts/accepted-release/NewModCompiler-Win32-Debug.zip
            recovery/artifacts/accepted-release/NewModCompiler-Win32-Debug.manifest.json
            recovery/artifacts/accepted-release/export-receipt.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.release.outcome == 'success' }}
        with:
          name: compiler-accepted-release-Release-${{ steps.reuse.outputs.sourceRunId }}-${{ github.run_id }}
          path: |
            recovery/artifacts/accepted-release/NewModCompiler-Win32-Release.zip
            recovery/artifacts/accepted-release/NewModCompiler-Win32-Release.manifest.json
            recovery/artifacts/accepted-release/export-receipt.json
          if-no-files-found: error
