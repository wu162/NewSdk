name: Audio resampler kernel validation
on:
  push:
    branches: [recovery/audio-compiler-source]
    paths:
      - '.github/workflows/audio-resampler-kernel.yml'
      - 'src/AudioCompiler/Native/Resampler*.cs'
      - 'recovery/scripts/TestAudioResampler.ps1'
      - 'recovery/scripts/GenerateAudioResampler*.py'
      - 'recovery/tests/Audio*Resampler*.cs'
      - 'recovery/evidence/audio/native-resampler/**'
      - 'SDK/tools/BinaryAssetBuilder.AudioCompiler.dll'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: audio-resampler-${{ github.ref }}
  cancel-in-progress: false
jobs:
  oracle:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate original-machine-code oracle on pinned Linux host
        run: |
          python -m pip install unicorn==2.1.4 pefile==2024.8.26
          python recovery/scripts/GenerateAudioResamplerOracle.py --output oracle/original.tsv.gz
      - uses: actions/upload-artifact@v4
        with:
          name: audio-resampler-oracle-${{ github.run_id }}-${{ github.run_attempt }}
          path: oracle/original.tsv.gz
          if-no-files-found: error
  validate:
    needs: oracle
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: audio-resampler-oracle-${{ github.run_id }}-${{ github.run_attempt }}
          path: oracle
      - name: Compare original CPU and Debug/Release kernel
        shell: pwsh
        run: ./recovery/scripts/TestAudioResampler.ps1 -OracleInput oracle/original.tsv.gz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audio-resampler-${{ github.run_id }}-${{ github.run_attempt }}
          path: recovery/evidence/audio/resampler-validation/${{ github.run_id }}-${{ github.run_attempt }}
      - name: Preserve kernel evidence
        if: always()
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- recovery/evidence/audio/resampler-validation
          if ($LASTEXITCODE -ne 0) { throw 'Evidence staging failed' }
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { exit 0 }
          if ($LASTEXITCODE -ne 1) { throw 'Evidence diff failed' }
          git commit -m "audio: preserve resampler kernel evidence $env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          if ($LASTEXITCODE -ne 0) { throw 'Evidence commit failed' }
          git pull --rebase origin $env:GITHUB_REF_NAME
          if ($LASTEXITCODE -ne 0) { throw 'Concurrent changes require resolution' }
          git push origin "HEAD:$env:GITHUB_REF_NAME"
          if ($LASTEXITCODE -ne 0) { throw 'Evidence push failed' }
