name: Prepared RA3 AssetMerge original differential
on:
  push:
    branches: [compiler-main, refactor/modcompiler-p0-p3]
    paths:
      - '.github/workflows/refactor-assetmerge.yml'
      - 'recovery/preparation/assetmerge/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  assetmerge:
    runs-on: windows-2022
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            recovery/preparation/assetmerge
            SDK/tools
      - name: Compare original AssetMerge raw stream and CDATA outputs
        shell: pwsh
        run: |
          $vs=& "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe" -latest -products '*' -requires Microsoft.Component.MSBuild -property installationPath
          $csc=Join-Path $vs 'MSBuild/Current/Bin/Roslyn/csc.exe'
          foreach($mode in @('Debug','Release')) {
            $out="recovery/artifacts/assetmerge/$mode";New-Item -ItemType Directory -Force $out|Out-Null
            $opt=if($mode -eq 'Release'){'/optimize+'}else{'/debug:full'}
            & $csc /nologo /target:exe /platform:x86 /langversion:7.3 $opt "/out:$out/AssetMergeControl.exe" recovery/preparation/assetmerge/AssetMerge.cs recovery/preparation/assetmerge/AssetMergeControl.cs
            if($LASTEXITCODE -ne 0){throw 'AssetMerge validation host compilation failed'}
            python recovery/preparation/assetmerge/TestCompilerAssetMerge.py --original SDK/tools/AssetMerge.exe --candidate "$out/AssetMergeControl.exe" --output "$out/evidence"
            if($LASTEXITCODE -ne 0){throw 'Original AssetMerge raw differential failed'}
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prepared-assetmerge-${{ github.run_id }}-${{ github.run_attempt }}
          path: recovery/artifacts/assetmerge/**
          if-no-files-found: error
