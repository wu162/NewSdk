name: WeaponTemplate recovery validation
on:
  push:
    branches: [recovery/compiler-source]
    paths:
      - '.github/workflows/recovered-weapon.yml'
      - 'recovery/src/**/Weapon*'
      - 'recovery/src/**/ResourceMarshaling*'
      - 'recovery/src/**/EnumBitset*'
      - 'recovery/src/**/ObjectFilter*'
      - 'recovery/tests/Weapon*'
      - 'recovery/scripts/TestWeapon.ps1'
      - 'recovery/scripts/ExtractWeaponEvidence.py'
permissions:
  contents: write
jobs:
  differential:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86
      - name: Capture focused committed evidence
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force recovery/evidence/weapon | Out-Null
          $lines = Get-Content recovery/decompiled/BinaryAssetBuilder.Tokenizer/-Module-.cs
          $lines[17515..18180] | Set-Content recovery/evidence/weapon/marshal.txt
          $lines[79735..80280] | Set-Content recovery/evidence/weapon/tokenize.txt
          # Original helper evidence, using one-based source line numbers.
          $helperRanges = @(
            @{ Name = 'ScatterRadiusType Marshal'; Start = 15370; End = 15410 }
            @{ Name = 'ScatterRadius list Marshal'; Start = 53635; End = 53676 }
            @{ Name = 'ScatterRadius endian'; Start = 53831; End = 53880 }
            @{ Name = 'ModelCondition text parser'; Start = 67323; End = 67447 }
            @{ Name = 'ScatterRadius Tokenize'; Start = 78584; End = 78606 }
            @{ Name = 'ScatterRadius list Tokenize'; Start = 99207; End = 99233 }
            @{ Name = 'ObjectFilter Marshal and endian'; Start = 13601; End = 13696 }
            @{ Name = 'ObjectFilter Tokenize'; Start = 77370; End = 77440 }
            @{ Name = 'KindOf and relationship bitsets'; Start = 66947; End = 67190 }
            @{ Name = 'AttributeModifier list Marshal'; Start = 53677; End = 53725 }
            @{ Name = 'AttributeModifier list Tokenize'; Start = 99234; End = 99281 }
            @{ Name = 'Enum token splitting'; Start = 12996; End = 13072 }
            @{ Name = 'ObjectStatus pointer Marshal'; Start = 51212; End = 51225 }
            @{ Name = 'ObjectStatus inline Marshal and endian'; Start = 51592; End = 51740 }
            @{ Name = 'ObjectStatus text parser'; Start = 67448; End = 67571 }
            @{ Name = 'ObjectStatus pointer Tokenize'; Start = 98079; End = 98090 }
            @{ Name = 'FastHash'; Start = 12274; End = 12329 }
            @{ Name = 'SoundOrEvaEvent Marshal'; Start = 13587; End = 13602 }
            @{ Name = 'WeaponAiHintInfo Marshal'; Start = 15328; End = 15341 }
            @{ Name = 'String allocation'; Start = 51067; End = 51094 }
            @{ Name = 'Inline FX reference'; Start = 51542; End = 51558 }
            @{ Name = 'Pointer audio reference'; Start = 66888; End = 66900 }
            @{ Name = 'Typed ID and pointer weapon reference'; Start = 68432; End = 68492 }
            @{ Name = 'ANSI Value conversion'; Start = 76566; End = 76594 }
            @{ Name = 'SoundOrEvaEvent Tokenize'; Start = 76849; End = 76877 }
            @{ Name = 'WeaponAiHintInfo Tokenize'; Start = 78529; End = 78566 }
            @{ Name = 'Reference and string Tokenize'; Start = 97830; End = 97847 }
          )
          $helperEvidence = foreach ($range in $helperRanges) {
            if ($range.Start -lt 1 -or $range.End -gt $lines.Count) { throw 'Helper evidence range is outside committed source' }
            "=== $($range.Name): -Module-.cs lines $($range.Start)-$($range.End) ==="
            for ($line = $range.Start; $line -le $range.End; ++$line) {
              '{0}: {1}' -f $line, $lines[$line - 1]
            }
            ''
          }
          $helperEvidence | Set-Content recovery/evidence/weapon/resource-helpers.txt
      - name: Read original enum maps
        shell: pwsh
        run: python recovery/scripts/ExtractWeaponEvidence.py
      - name: Build and compare
        shell: pwsh
        run: |
          ./recovery/scripts/TestWeapon.ps1
      - name: Persist validation evidence
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $evidence = 'recovery/evidence/weapon'
          $validationPath = "$evidence/validation.json"
          $validation = Get-Content $validationPath -Raw | ConvertFrom-Json
          if ($validation.sourceCommit -ne $env:GITHUB_SHA) {
            Write-Host 'Validation did not start for this source; retaining artifact output without committing stale evidence.'
            exit 0
          }
          $validation | Add-Member -Force NoteProperty runId ([long]$env:GITHUB_RUN_ID)
          $validation | Add-Member -Force NoteProperty runUrl "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          $validation | ConvertTo-Json -Depth 10 | Set-Content $validationPath
          $files = @(Get-ChildItem $evidence -File | Where-Object { $_.Extension -eq '.txt' -or $_.Name -eq 'validation.json' -or $_.Name -eq 'enums.json' })
          $hashes = [ordered]@{}
          foreach ($file in $files) { $hashes[$file.Name] = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant() }
          $hashes | ConvertTo-Json | Set-Content "$evidence/log-sha256.json"
          Compress-Archive -Path $files.FullName -DestinationPath "$evidence/oracle-logs.zip" -Force
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$evidence/validation.json" "$evidence/enums.json" "$evidence/log-sha256.json" "$evidence/oracle-logs.zip"
          if ($LASTEXITCODE -ne 0) { throw 'Unable to stage evidence' }
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { exit 0 }
          if ($LASTEXITCODE -ne 1) { throw 'Unable to inspect staged evidence' }
          git commit -m "recovery: record WeaponTemplate validation for $env:GITHUB_SHA"
          if ($LASTEXITCODE -ne 0) { throw 'Unable to commit evidence' }
          git pull --rebase origin recovery/compiler-source
          if ($LASTEXITCODE -ne 0) { throw 'Evidence rebase failed; artifact remains available' }
          git push origin HEAD:recovery/compiler-source
          if ($LASTEXITCODE -ne 0) { throw 'Evidence push failed; artifact remains available' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recovered-weapon-evidence
          path: |
            recovery/evidence/weapon
            recovery/decompiled/BinaryAssetBuilder.Tokenizer/-Module-.cs
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: recovered-weapon-component-x86
          path: ${{ runner.temp }}/ra3-recovered-weapon/Recovered.Weapon.dll
          if-no-files-found: error
