name: WeaponTemplate recovery validation
on:
  push:
    branches: [recovery/compiler-source]
    paths:
      - '.github/workflows/recovered-weapon.yml'
      - 'recovery/src/**/Weapon*'
      - 'recovery/scripts/SetWeaponPlugin.ps1'
      - 'recovery/scripts/TestWeaponSdk.ps1'
      - 'recovery/src/**/ResourceMarshaling*'
      - 'recovery/src/**/EnumBitset*'
      - 'recovery/src/**/ObjectFilter*'
      - 'recovery/tests/Weapon*'
      - 'recovery/scripts/TestWeapon.ps1'
      - 'recovery/scripts/TestWeaponSdkProbe.ps1'
      - 'SDK/Mods/mymod/Data/RecoveryWeaponNuggetProbe.xml'
      - 'SDK/Mods/mymod/Data/Mod.xml'
      - 'recovery/scripts/ExtractWeaponEvidence.py'
permissions:
  contents: write
jobs:
  differential:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86
      - name: Capture focused committed evidence
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force recovery/evidence/weapon | Out-Null
          $lines = Get-Content recovery/decompiled/BinaryAssetBuilder.Tokenizer/-Module-.cs
          $lines[17515..18180] | Set-Content recovery/evidence/weapon/marshal.txt
          $lines[79735..80280] | Set-Content recovery/evidence/weapon/tokenize.txt
          # Original helper evidence, using one-based source line numbers.
          $helperRanges = @(
            @{ Name = 'RGBColor Marshal and endian'; Start = 13320; End = 13378 }
            @{ Name = 'RGBColor Tokenize'; Start = 76714; End = 76734 }
            @{ Name = 'MetaImpact allocation and tag'; Start = 52684; End = 52691 }
            @{ Name = 'TintObjects and AttributeModifier allocation and tags'; Start = 52795; End = 52811 }
            @{ Name = 'MetaImpact Marshal and endian'; Start = 16328; End = 16544 }
            @{ Name = 'TintObjects Marshal and endian'; Start = 16018; End = 16130 }
            @{ Name = 'AttributeModifier Marshal and endian'; Start = 16805; End = 16864 }
            @{ Name = 'MetaImpact Tokenize'; Start = 79149; End = 79239 }
            @{ Name = 'TintObjects Tokenize'; Start = 79012; End = 79048 }
            @{ Name = 'AttributeModifier Tokenize'; Start = 79356; End = 79392 }
            @{ Name = 'AttributeModifierCategory bit parser'; Start = 67837; End = 67961 }
            @{ Name = 'Paralyze Marshal and endian'; Start = 16733; End = 16804 }
            @{ Name = 'Paralyze enum helper'; Start = 53265; End = 53276 }
            @{ Name = 'Paralyze Tokenize'; Start = 79323; End = 79355 }
            @{ Name = 'InformationWarfare Marshal and endian'; Start = 16267; End = 16327 }
            @{ Name = 'InformationWarfare bit parser'; Start = 67718; End = 67842 }
            @{ Name = 'InformationWarfare Tokenize'; Start = 79124; End = 79148 }
            @{ Name = 'Attach Marshal'; Start = 15743; End = 15756 }
            @{ Name = 'Spend Marshal'; Start = 15912; End = 15926 }
            @{ Name = 'SecondaryDamage Marshal and endian'; Start = 16131; End = 16191 }
            @{ Name = 'Strip Marshal and endian'; Start = 16203; End = 16269 }
            @{ Name = 'Suppression Marshal and endian'; Start = 16545; End = 16624 }
            @{ Name = 'LuaEvent Marshal'; Start = 15818; End = 15838 }
            @{ Name = 'Attach Tokenize'; Start = 78797; End = 78813 }
            @{ Name = 'Spend Tokenize'; Start = 78936; End = 78952 }
            @{ Name = 'SecondaryDamage Tokenize'; Start = 79047; End = 79073 }
            @{ Name = 'Strip Tokenize'; Start = 79097; End = 79125 }
            @{ Name = 'Suppression Tokenize'; Start = 79240; End = 79272 }
            @{ Name = 'LuaEvent Tokenize'; Start = 78853; End = 78881 }
            @{ Name = 'Lifetime-only Marshal'; Start = 15802; End = 15866 }
            @{ Name = 'Stream Marshal and endian'; Start = 15927; End = 15975 }
            @{ Name = 'TerrainCrater Marshal and endian'; Start = 15976; End = 16017 }
            @{ Name = 'Laser Marshal and endian'; Start = 16625; End = 16687 }
            @{ Name = 'Lifetime-only Tokenize'; Start = 78835; End = 78914 }
            @{ Name = 'Stream Tokenize'; Start = 78953; End = 78973 }
            @{ Name = 'TerrainCrater Tokenize'; Start = 78991; End = 79013 }
            @{ Name = 'Laser Tokenize'; Start = 79273; End = 79301 }
            @{ Name = 'InformTarget Marshal and endian'; Start = 15867; End = 15920 }
            @{ Name = 'InformTarget Tokenize'; Start = 78915; End = 78937 }
            @{ Name = 'SpecialPower and base-only allocations'; Start = 52732; End = 52773 }
            @{ Name = 'SlavesAttack allocation'; Start = 52851; End = 52862 }
            @{ Name = 'ReportWeaponFiredStat allocation'; Start = 52905; End = 52916 }
            @{ Name = 'SpecialPower Tokenize'; Start = 78974; End = 78990 }
            @{ Name = 'Base-only Tokenize wrappers'; Start = 98857; End = 98985 }
            @{ Name = 'SeedTiberium Marshal and endian'; Start = 16688; End = 16735 }
            @{ Name = 'SeedTiberium Tokenize'; Start = 79302; End = 79324 }
            @{ Name = 'Projectile Marshal and endian'; Start = 16865; End = 16960 }
            @{ Name = 'Projectile Tokenize'; Start = 79393; End = 79449 }
            @{ Name = 'ScatterProjectile Marshal and endian'; Start = 15757; End = 15802 }
            @{ Name = 'ScatterProjectile Tokenize'; Start = 78814; End = 78836 }
            @{ Name = 'WeaponOCL Marshal'; Start = 16192; End = 16202 }
            @{ Name = 'WeaponOCL Tokenize'; Start = 79074; End = 79096 }
            @{ Name = 'VeteranProjectile Marshal'; Start = 15319; End = 15327 }
            @{ Name = 'VeteranProjectile Tokenize'; Start = 78512; End = 78528 }
            @{ Name = 'VeteranProjectile list Marshal and endian'; Start = 53300; End = 53394 }
            @{ Name = 'VeteranProjectile list Tokenize'; Start = 99038; End = 99064 }
            @{ Name = 'DamageContainedNuggetType Tokenizer_002ETokenize'; Start = 79731; End = 79755 }
            @{ Name = 'DamageContainedNuggetType Marshaler_002EMarshal'; Start = 17498; End = 17529 }
            @{ Name = 'FireOnObjects and DamageAndSpawn Marshal'; Start = 17392; End = 17480 }
            @{ Name = 'FireOnObjects and DamageAndSpawn Tokenize'; Start = 79667; End = 79740 }
            @{ Name = 'Line and leech Marshal'; Start = 17219; End = 17343 }
            @{ Name = 'Line and leech Tokenize'; Start = 79571; End = 79641 }
            @{ Name = 'WeaponEffectNugget common Marshal and endian'; Start = 15406; End = 15498 }
            @{ Name = 'Nugget polymorphic Marshal dispatch'; Start = 15499; End = 15623 }
            @{ Name = 'Unknown Nugget allocation and zero tag'; Start = 52980; End = 52986 }
            @{ Name = 'Nugget polymorphic endian dispatch'; Start = 15624; End = 15742 }
            @{ Name = 'Unknown Nugget endian helper'; Start = 53210; End = 53213 }
            @{ Name = 'Nugget polymorphic Tokenize with no default'; Start = 78676; End = 78796 }
            @{ Name = 'DamageNugget Marshal and endian'; Start = 16961; End = 17218 }
            @{ Name = 'ScalarInfo Marshal'; Start = 15339; End = 15369 }
            @{ Name = 'ScalarInfo list Marshal'; Start = 53395; End = 53436 }
            @{ Name = 'DamageNugget allocation'; Start = 52948; End = 52955 }
            @{ Name = 'Nugget common Tokenize'; Start = 78605; End = 78683 }
            @{ Name = 'DamageNugget Tokenize'; Start = 79450; End = 79570 }
            @{ Name = 'Nugget list Tokenize'; Start = 99182; End = 99206 }
            @{ Name = 'DOT Marshal and endian'; Start = 17344; End = 17390 }
            @{ Name = 'DOT Tokenize'; Start = 79642; End = 79666 }
            @{ Name = 'ScatterRadiusType Marshal'; Start = 15370; End = 15410 }
            @{ Name = 'ScatterRadius list Marshal'; Start = 53635; End = 53676 }
            @{ Name = 'ScatterRadius endian'; Start = 53831; End = 53880 }
            @{ Name = 'ModelCondition text parser'; Start = 67323; End = 67447 }
            @{ Name = 'ScatterRadius Tokenize'; Start = 78584; End = 78606 }
            @{ Name = 'ScatterRadius list Tokenize'; Start = 99207; End = 99233 }
            @{ Name = 'ObjectFilter Marshal and endian'; Start = 13601; End = 13696 }
            @{ Name = 'ObjectFilter Tokenize'; Start = 77370; End = 77440 }
            @{ Name = 'KindOf and relationship bitsets'; Start = 66947; End = 67190 }
            @{ Name = 'AttributeModifier list Marshal'; Start = 53677; End = 53725 }
            @{ Name = 'AttributeModifier list Tokenize'; Start = 99234; End = 99281 }
            @{ Name = 'Enum token splitting'; Start = 12996; End = 13072 }
            @{ Name = 'ObjectStatus pointer Marshal'; Start = 51212; End = 51225 }
            @{ Name = 'ObjectStatus inline Marshal and endian'; Start = 51592; End = 51740 }
            @{ Name = 'ObjectStatus text parser'; Start = 67448; End = 67571 }
            @{ Name = 'ObjectStatus pointer Tokenize'; Start = 98079; End = 98090 }
            @{ Name = 'FastHash'; Start = 12274; End = 12329 }
            @{ Name = 'SoundOrEvaEvent Marshal'; Start = 13587; End = 13602 }
            @{ Name = 'WeaponAiHintInfo Marshal'; Start = 15328; End = 15341 }
            @{ Name = 'String allocation'; Start = 51067; End = 51094 }
            @{ Name = 'Inline FX reference'; Start = 51542; End = 51558 }
            @{ Name = 'Pointer audio reference'; Start = 66888; End = 66900 }
            @{ Name = 'Typed ID and pointer weapon reference'; Start = 68432; End = 68492 }
            @{ Name = 'ANSI Value conversion'; Start = 76566; End = 76594 }
            @{ Name = 'SoundOrEvaEvent Tokenize'; Start = 76849; End = 76877 }
            @{ Name = 'WeaponAiHintInfo Tokenize'; Start = 78529; End = 78566 }
            @{ Name = 'Reference and string Tokenize'; Start = 97830; End = 97847 }
          )
          $helperEvidence = foreach ($range in $helperRanges) {
            if ($range.Start -lt 1 -or $range.End -gt $lines.Count) { throw 'Helper evidence range is outside committed source' }
            "=== $($range.Name): -Module-.cs lines $($range.Start)-$($range.End) ==="
            for ($line = $range.Start; $line -le $range.End; ++$line) {
              '{0}: {1}' -f $line, $lines[$line - 1]
            }
            ''
          }
          $helperEvidence | Set-Content recovery/evidence/weapon/resource-helpers.txt
      - name: Read original enum maps
        shell: pwsh
        run: python recovery/scripts/ExtractWeaponEvidence.py
      - name: Build and compare
        shell: pwsh
        run: |
          ./recovery/scripts/TestWeapon.ps1
      # Real SDK builds are deliberately batched; mark a milestone commit [sdk-probe].
      - name: Validate schema-valid mymod Nugget probes through original SDK
        if: contains(github.event.head_commit.message, '[sdk-probe]')
        shell: pwsh
        run: ./recovery/scripts/TestWeaponSdkProbe.ps1
      - name: Validate formal Weapon plugin through original and recovered SDK routes
        if: contains(github.event.head_commit.message, '[sdk-plugin]')
        shell: pwsh
        run: ./recovery/scripts/TestWeaponSdk.ps1
      - name: Persist validation evidence
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $evidence = 'recovery/evidence/weapon'
          $validationPath = "$evidence/validation.json"
          $validation = Get-Content $validationPath -Raw | ConvertFrom-Json
          if ($validation.sourceCommit -ne $env:GITHUB_SHA) {
            Write-Host 'Validation did not start for this source; retaining artifact output without committing stale evidence.'
            exit 0
          }
          $validation | Add-Member -Force NoteProperty runId ([long]$env:GITHUB_RUN_ID)
          $validation | Add-Member -Force NoteProperty runUrl "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          $validation | ConvertTo-Json -Depth 10 | Set-Content $validationPath
          if ($validation.sdkProbeSucceeded -ne $true) {
            Remove-Item "$evidence/nugget-sdk.json", "$evidence/nugget-sdk-output.zip" -ErrorAction SilentlyContinue
          }
          $files = @(Get-ChildItem $evidence -File | Where-Object { $_.Extension -eq '.txt' -or $_.Name -eq 'validation.json' -or $_.Name -eq 'enums.json' -or $_.Name -eq 'nugget-sdk.json' -or $_.Name -eq 'nugget-sdk-output.zip' })
          $hashes = [ordered]@{}
          foreach ($file in $files) { $hashes[$file.Name] = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant() }
          $hashes | ConvertTo-Json | Set-Content "$evidence/log-sha256.json"
          Compress-Archive -Path $files.FullName -DestinationPath "$evidence/oracle-logs.zip" -Force
          if ($validation.sdkProbeSucceeded -eq $true) {
            Copy-Item $validationPath "$evidence/sdk-batch-validation.json" -Force
            Copy-Item "$evidence/oracle-logs.zip" "$evidence/sdk-batch-logs.zip" -Force
            git add "$evidence/sdk-batch-validation.json" "$evidence/sdk-batch-logs.zip"
            if ($LASTEXITCODE -ne 0) { throw 'Unable to stage successful SDK batch snapshot' }
          }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if (Test-Path "$evidence/formal-sdk") {
            Compress-Archive -Path "$evidence/formal-sdk/*" -DestinationPath "$evidence/formal-sdk-output.zip" -Force
            git add "$evidence/formal-sdk.json" "$evidence/formal-sdk-output.zip"
            if ($LASTEXITCODE -ne 0) { throw 'Unable to stage formal SDK evidence' }
          }
          git add "$evidence/validation.json" "$evidence/enums.json" "$evidence/log-sha256.json" "$evidence/oracle-logs.zip"
          if ($LASTEXITCODE -ne 0) { throw 'Unable to stage evidence' }
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { exit 0 }
          if ($LASTEXITCODE -ne 1) { throw 'Unable to inspect staged evidence' }
          git commit -m "recovery: record WeaponTemplate validation for $env:GITHUB_SHA"
          if ($LASTEXITCODE -ne 0) { throw 'Unable to commit evidence' }
          git pull --rebase origin recovery/compiler-source
          if ($LASTEXITCODE -ne 0) { throw 'Evidence rebase failed; artifact remains available' }
          git push origin HEAD:recovery/compiler-source
          if ($LASTEXITCODE -ne 0) { throw 'Evidence push failed; artifact remains available' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recovered-weapon-evidence
          path: |
            recovery/evidence/weapon
            recovery/decompiled/BinaryAssetBuilder.Tokenizer/-Module-.cs
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: recovered-weapon-component-x86
          path: |
            ${{ runner.temp }}/ra3-recovered-weapon/Recovered.Weapon.dll
            ${{ runner.temp }}/ra3-recovered-weapon/Recovered.WeaponPlugin.dll
          if-no-files-found: error



