name: Audio compiler validation
on:
  push:
    branches: [recovery/audio-compiler-source]
    paths:
      - '.github/workflows/audio-compiler-validation.yml'
      - 'src/AudioCompiler/**'
      - 'recovery/scripts/TestAudio*.ps1'
      - 'recovery/tests/Audio*.cs'
      - 'SDK/tools/BinaryAssetBuilder.AudioCompiler.dll'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: audio-validation-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Compare PathMusic and MP3 handlers and collect codec probes
        shell: pwsh
        run: |
          ./recovery/scripts/TestAudioPlugin.ps1 -IncludeMp3
      - name: Build standalone source project
        if: always()
        shell: pwsh
        run: |
          dotnet build src/AudioCompiler/BinaryAssetBuilder.AudioCompiler.csproj -c Debug
          if ($LASTEXITCODE -ne 0) { throw "Debug project build failed" }
          dotnet build src/AudioCompiler/BinaryAssetBuilder.AudioCompiler.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw "Release project build failed" }
      - name: Compare PCM encoder component
        if: always()
        shell: pwsh
        run: ./recovery/scripts/TestAudioPcm.ps1 -OriginalEvidenceDirectory "recovery/evidence/audio/plugin-validation/$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
      - name: Compare XAS encoder component
        if: always()
        shell: pwsh
        run: ./recovery/scripts/TestAudioPcm.ps1 -Codec XAS -OriginalEvidenceDirectory "recovery/evidence/audio/plugin-validation/$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audio-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            recovery/evidence/audio/pcm-validation/${{ github.run_id }}-${{ github.run_attempt }}
            recovery/evidence/audio/xas-validation/${{ github.run_id }}-${{ github.run_attempt }}
            recovery/evidence/audio/plugin-validation/${{ github.run_id }}-${{ github.run_attempt }}
      - name: Preserve validation evidence
        if: always()
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- recovery/evidence/audio/plugin-validation recovery/evidence/audio/pcm-validation recovery/evidence/audio/xas-validation
          if (git diff --cached --quiet) { exit 0 }
          git commit -m "audio: preserve component validation evidence $env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          if ($LASTEXITCODE -ne 0) { throw 'Evidence commit failed' }
          git pull --rebase origin $env:GITHUB_REF_NAME
          if ($LASTEXITCODE -ne 0) { throw 'Concurrent changes require resolution' }
          git push origin "HEAD:$env:GITHUB_REF_NAME"
          if ($LASTEXITCODE -ne 0) { throw 'Evidence push failed' }
