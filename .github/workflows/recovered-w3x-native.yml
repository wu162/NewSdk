name: Recovered W3X native components
on:
  push:
    branches: [recovery/w3xcompiler-source]
    paths:
      - '.github/workflows/recovered-w3x-native.yml'
      - 'recovery/src/Native/W3x/**'
      - 'recovery/src/Bridge/W3x/**'
      - 'recovery/tests/W3x*Tests.cpp'
      - 'recovery/tests/W3xNativeOracle.cpp'
      - 'recovery/tests/W3xAdaptiveDeltaOracle.cpp'
      - 'recovery/tests/W3xMeshBuilderOracle.cpp'
      - 'recovery/tests/W3xTimecodedOracle.cpp'
      - 'recovery/tests/W3xAnimationOracle.cs'
      - 'recovery/tests/W3xMeshAssetOracle.cs'
      - 'recovery/tests/W3xStandaloneReplay.cs'
      - 'recovery/scripts/TestW3xNative.ps1'
      - 'SDK/tools/BinaryAssetBuilder.W3XCompiler.dll'
      - 'SDK/tools/BinaryAssetBuilder.Core.dll'
      - 'recovery/src/Plugin/W3x/NativePlugin.cs'
      - 'recovery/tests/W3xPluginOracle.cs'
      - 'recovery/scripts/BuildW3xPlugin.ps1'
      - 'recovery/scripts/TestW3xPlugin.ps1'
      - 'recovery/scripts/TestW3xSdkPreparation.ps1'
      - 'recovery/scripts/TestW3xSdk.ps1'
      - 'recovery/scripts/VerifyW3xSdkGate.ps1'
      - 'recovery/tests/W3xSdkOracle.cs'
      - 'SDK/Mods/W3xRecovery/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: w3x-native-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86
      - name: Build both native modes and compare original converter IL
        shell: pwsh
        run: ./recovery/scripts/TestW3xNative.ps1
      - name: Verify loadable plugin and standalone plugin replay
        shell: pwsh
        run: ./recovery/scripts/TestW3xPlugin.ps1 -CaptureDirectory "${{ github.workspace }}/recovery/evidence/w3x/native-runs/$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT" -OutputDirectory "recovery/evidence/w3x/plugin-runs/$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
      - name: Parse SDK facilities and validate complete MOD schema without running SDK
        shell: pwsh
        run: ./recovery/scripts/TestW3xSdkPreparation.ps1
      - name: Publish results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w3x-native-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            recovery/evidence/w3x/native-runs/${{ github.run_id }}-${{ github.run_attempt }}
            recovery/evidence/w3x/plugin-runs/${{ github.run_id }}-${{ github.run_attempt }}/plugin-validation.json
            recovery/evidence/w3x/plugin-runs/${{ github.run_id }}-${{ github.run_attempt }}/*.log
            recovery/evidence/w3x/plugin-runs/${{ github.run_id }}-${{ github.run_attempt }}/**/plugin-build.json
            recovery/evidence/w3x/plugin-runs/${{ github.run_id }}-${{ github.run_attempt }}/**/build-logs/**
            recovery/evidence/w3x/plugin-runs/${{ github.run_id }}-${{ github.run_attempt }}/**/Recovered.W3x*.dll
            recovery/evidence/w3x/preparation-runs/${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 30
