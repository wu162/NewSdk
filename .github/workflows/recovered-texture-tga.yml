name: Texture TGA decoder probe
on:
  push:
    branches: [recovery/texturecompiler-source]
    paths:
      - 'src/TextureCompiler/Managed/TextureTgaDecoder.cs'
      - 'recovery/tests/TextureTgaOracle.cs'
      - 'recovery/tests/fixtures/texture-main/**'
      - 'recovery/scripts/TestTextureTga.ps1'
      - '.github/workflows/recovered-texture-tga.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  tga:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Probe original decoder and candidate without claiming acceptance
        shell: pwsh
        run: ./recovery/scripts/TestTextureTga.ps1 -ProbeOnly
      - name: Preserve pixel evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: texture-tga-${{ github.run_id }}-${{ github.run_attempt }}
          path: recovery/evidence/texture/tga/${{ github.run_id }}-${{ github.run_attempt }}
      - name: Commit probe evidence
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "recovery/evidence/texture/tga/$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          if (git diff --cached --quiet) { exit 0 }
          git commit -m "texture: record TGA decoder probe $env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          if ($LASTEXITCODE -ne 0) { throw 'Evidence commit failed' }
          git pull --rebase origin $env:GITHUB_REF_NAME
          if ($LASTEXITCODE -ne 0) { throw 'Concurrent update needs resolution' }
          git push origin "HEAD:$env:GITHUB_REF_NAME"
          if ($LASTEXITCODE -ne 0) { throw 'Evidence push failed' }
