name: Inspect original Power continuation enums
on:
  push:
    branches: [recovery/compiler-source]
    paths:
      - 'recovery/scripts/InspectPowerContinuationEnums.py'
      - '.github/workflows/power-continuation-source.yml'
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify original source and PE, then read all five enum tables
        run: python recovery/scripts/InspectPowerContinuationEnums.py
      - name: Save read-only enum evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add recovery/evidence/gameobject-modules/power-continuation-enums.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "recovery: record original Power enum evidence for $GITHUB_SHA"
          git pull --rebase origin recovery/compiler-source
          git push origin HEAD:recovery/compiler-source
      - uses: actions/upload-artifact@v4
        with:
          name: original-power-continuation-enums
          path: recovery/evidence/gameobject-modules/power-continuation-enums.json
