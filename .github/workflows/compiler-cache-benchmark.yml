name: Bounded legacy compiler cache benchmark
on:
  push:
    branches: [recovery/legacy-sdk-cache, compiler-main]
    paths:
      - '.github/workflows/compiler-cache-benchmark.yml'
      - 'recovery/scripts/BenchmarkCompilerCache.py'
      - 'recovery/scripts/PrepareCompilerCacheBenchmark.py'
      - 'recovery/tests/test_cache_benchmark.py'
      - 'recovery/tests/test_prepare_cache_benchmark.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: cache-benchmark-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false
jobs:
  benchmark:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[cache-benchmark]')
    runs-on: windows-2022
    timeout-minutes: 8
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/recovery/evidence/
      - name: Fast benchmark correctness checks
        shell: pwsh
        run: |
          python -m unittest discover -s recovery/tests -p '*cache_benchmark.py' -v
          if($LASTEXITCODE -ne 0){throw 'Benchmark preflight failed'}
      - name: Verify and stage accepted Release and bounded workloads
        timeout-minutes: 2
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python recovery/scripts/PrepareCompilerCacheBenchmark.py --repo . --candidate-commit $env:GITHUB_SHA --output "$env:RUNNER_TEMP/cb"
          if($LASTEXITCODE -ne 0){throw 'Accepted benchmark runtime preparation failed'}
      - name: Run six cache modes with strict process and total budgets
        timeout-minutes: 4
        shell: pwsh
        run: |
          $out="recovery/evidence/refactor/cache-benchmark/$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          python recovery/scripts/BenchmarkCompilerCache.py --preparation "$env:RUNNER_TEMP/cb/preparation.json" --sdk-root "$PWD/SDK" --output $out --timeout-seconds 30 --budget-seconds 180 --hot-runs 2
          $benchmarkExit=$LASTEXITCODE
          if(Test-Path $out){Copy-Item "$env:RUNNER_TEMP/cb/preparation.json" "$out/preparation.json"}
          if(Test-Path "$out/benchmark.md"){Get-Content "$out/benchmark.md"|Add-Content $env:GITHUB_STEP_SUMMARY}
          if($benchmarkExit -ne 0){throw 'Benchmark failed or exhausted its time budget; partial evidence retained'}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compiler-cache-benchmark-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            recovery/evidence/refactor/cache-benchmark/${{ github.run_id }}-${{ github.run_attempt }}/preparation.json
            recovery/evidence/refactor/cache-benchmark/${{ github.run_id }}-${{ github.run_attempt }}/benchmark.json
            recovery/evidence/refactor/cache-benchmark/${{ github.run_id }}-${{ github.run_attempt }}/benchmark.md
            recovery/evidence/refactor/cache-benchmark/${{ github.run_id }}-${{ github.run_attempt }}/summary.csv
            recovery/evidence/refactor/cache-benchmark/${{ github.run_id }}-${{ github.run_attempt }}/*/request.json
            recovery/evidence/refactor/cache-benchmark/${{ github.run_id }}-${{ github.run_attempt }}/*/report.json
            recovery/evidence/refactor/cache-benchmark/${{ github.run_id }}-${{ github.run_attempt }}/*/stdout.log
            recovery/evidence/refactor/cache-benchmark/${{ github.run_id }}-${{ github.run_attempt }}/*/stderr.log
