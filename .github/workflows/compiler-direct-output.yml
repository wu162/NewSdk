name: Direct compiler output and legacy cache
on:
  push:
    branches: [perf/direct-sdk-output]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: direct-output-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false
jobs:
  verify:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[direct-output]')
    runs-on: windows-2022
    timeout-minutes: 50
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/recovery/evidence/
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86
      - name: Install pinned build and protocol dependencies
        run: python -m pip install -r recovery/probes/TextureRedirect/requirements.txt -r recovery/scripts/app-protocol-requirements.txt lxml==6.0.2
      - name: App contracts and controller preflight
        shell: pwsh
        run: |
          foreach($mode in @('Debug','Release')) {
            ./recovery/scripts/TestApp.ps1 -Configuration $mode -OutputDirectory "recovery/artifacts/direct-app/$mode"
          }
          foreach($path in Get-ChildItem recovery/scripts/TestCompiler*.ps1) {
            $tokens=$null;$errors=$null
            $null=[Management.Automation.Language.Parser]::ParseFile($path.FullName,[ref]$tokens,[ref]$errors)
            if($errors.Count){$errors|Format-List|Out-Host;throw "PowerShell syntax errors: $path"}
          }
          python -m unittest discover -s recovery/tests -p test_compiler_hot_cache.py -v
          if($LASTEXITCODE -ne 0){throw 'Hot-cache preflight failed'}
      - name: Build current Debug and Release Win32 products
        id: product
        shell: pwsh
        run: |
          foreach($mode in @('Debug','Release')) {
            ./recovery/scripts/BuildCompiler.ps1 -Configuration $mode -OutputDirectory "recovery/artifacts/direct-product/$mode"
            ./recovery/scripts/BuildCompilerValidationHost.ps1 -ProductBuildDirectory "recovery/artifacts/direct-product/$mode" -OutputDirectory "recovery/artifacts/direct-product/$mode/validation"
          }
      - name: Targeted Core lifecycle and application pipeline
        if: ${{ !cancelled() && steps.product.outcome == 'success' }}
        shell: pwsh
        run: ./recovery/scripts/TestCompilerCoreLifecycle.ps1 -CompilerDirectory recovery/artifacts/direct-product -OutputDirectory recovery/artifacts/direct-tests/lifecycle
      - name: Actual CLI cancellation and content selections
        if: ${{ !cancelled() && steps.product.outcome == 'success' }}
        shell: pwsh
        run: ./recovery/scripts/TestCompilerCli.ps1 -CompilerDirectory recovery/artifacts/direct-product -OutputDirectory recovery/artifacts/direct-tests/cli
      - name: Original SDK cache formats, cold hot edits and CDATA
        if: ${{ !cancelled() && steps.product.outcome == 'success' }}
        shell: pwsh
        run: ./recovery/scripts/TestCompilerSessionCache.ps1 -CompilerDirectory recovery/artifacts/direct-product -OutputDirectory recovery/artifacts/direct-tests/session
      - name: Build asset cache and payload invalidation
        if: ${{ !cancelled() && steps.product.outcome == 'success' }}
        shell: pwsh
        run: |
          ./recovery/scripts/TestCompilerBuildCache.ps1 -CompilerDirectory recovery/artifacts/direct-product -OutputDirectory recovery/artifacts/direct-tests/assets
          ./recovery/scripts/TestCompilerBuildCachePayloads.ps1 -CompilerDirectory recovery/artifacts/direct-product -OutputDirectory recovery/artifacts/direct-tests/payloads
      - name: BIG LoD Additional SKUDEF against original MakeBig
        if: ${{ !cancelled() && steps.product.outcome == 'success' }}
        shell: pwsh
        run: ./recovery/scripts/TestCompilerBig.ps1 -CompilerDirectory recovery/artifacts/direct-product -OutputDirectory recovery/artifacts/direct-tests/big
      - name: Complete mymod original SDK output differential
        if: ${{ !cancelled() && steps.product.outcome == 'success' }}
        shell: pwsh
        run: ./recovery/scripts/TestCompilerSdk.ps1 -CompilerDirectory recovery/artifacts/direct-product -OutputDirectory recovery/artifacts/direct-tests/sdk -TimeoutSeconds 600
      - name: Bounded mixed hot cache and dependency invalidation
        if: ${{ !cancelled() && steps.product.outcome == 'success' }}
        shell: pwsh
        run: |
          python recovery/scripts/TestCompilerHotCache.py --build-directory recovery/artifacts/direct-product/Release --work "$env:RUNNER_TEMP/direct-hot" --output recovery/artifacts/direct-tests/hot --source-commit $env:GITHUB_SHA --budget 120 --timeout 15
          if($LASTEXITCODE -ne 0){throw 'Hot-cache matrix failed'}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compiler-direct-output-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            recovery/artifacts/direct-app/**
            recovery/artifacts/direct-product/**/*.log
            recovery/artifacts/direct-product/**/*.json
            recovery/artifacts/direct-product/**/bin/*
            recovery/artifacts/direct-tests/**
          include-hidden-files: true
