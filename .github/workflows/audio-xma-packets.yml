name: Audio XMA integer packet validation
on:
  push:
    branches: [recovery/audio-compiler-source]
    paths:
      - '.github/workflows/audio-xma-packets.yml'
      - 'src/AudioCompiler/Native/XmaPacket*.cs'
      - 'recovery/scripts/TestAudioXmaPacket.ps1'
      - 'recovery/scripts/GenerateAudioXmaPacketOracle.py'
      - 'recovery/tests/AudioXmaPacketOracle.cs'
      - 'SDK/tools/BinaryAssetBuilder.AudioCompiler.dll'
      - 'recovery/evidence/audio/plugin-validation/40199000936-1/xma-original.txt'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: audio-xma-packets-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned integer oracle dependencies
        shell: pwsh
        run: python -m pip install unicorn==2.1.4 pefile==2024.8.26
      - name: Compare original CPU and Debug/Release packet helpers
        shell: pwsh
        run: ./recovery/scripts/TestAudioXmaPacket.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audio-xma-packets-${{ github.run_id }}-${{ github.run_attempt }}
          path: recovery/evidence/audio/xma-packet-validation/${{ github.run_id }}-${{ github.run_attempt }}
      - name: Preserve packet evidence
        if: always()
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- recovery/evidence/audio/xma-packet-validation
          if ($LASTEXITCODE -ne 0) { throw 'Evidence staging failed' }
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { exit 0 }
          if ($LASTEXITCODE -ne 1) { throw 'Evidence diff failed' }
          git commit -m "audio: preserve XMA packet evidence $env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          if ($LASTEXITCODE -ne 0) { throw 'Evidence commit failed' }
          git pull --rebase origin $env:GITHUB_REF_NAME
          if ($LASTEXITCODE -ne 0) { throw 'Concurrent changes require resolution' }
          git push origin "HEAD:$env:GITHUB_REF_NAME"
          if ($LASTEXITCODE -ne 0) { throw 'Evidence push failed' }
