name: Texture compiler evidence
on:
  push:
    branches: [recovery/texturecompiler-source]
    paths:
      - '.github/workflows/texturecompiler-evidence.yml'
      - 'recovery/scripts/ExtractTexture.ps1'
      - 'recovery/MetadataInventory/**'
      - 'SDK/tools/BinaryAssetBuilder.TextureCompiler.dll'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: texture-evidence-${{ github.ref }}
  cancel-in-progress: false
jobs:
  inventory:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86
      - name: Inventory original compiler and plugin contract
        shell: pwsh
        run: ./recovery/scripts/ExtractTexture.ps1
      - name: Preserve evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: texture-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: recovery/evidence/texture/runs/${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 30
      - name: Save immutable successful extraction
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "recovery/evidence/texture/runs/$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          if (git diff --cached --quiet) { exit 0 }
          git commit -m "texture: preserve original evidence run $env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          if ($LASTEXITCODE -ne 0) { throw 'Evidence commit failed' }
          git pull --rebase origin $env:GITHUB_REF_NAME
          if ($LASTEXITCODE -ne 0) { throw 'Concurrent evidence update needs resolution; artifact retained' }
          git push origin "HEAD:$env:GITHUB_REF_NAME"
          if ($LASTEXITCODE -ne 0) { throw 'Evidence push failed; artifact retained' }
