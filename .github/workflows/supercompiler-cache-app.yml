name: SuperCompilerCache App contracts
on:
  push:
    branches: [feature/supercompiler-cache]
    paths:
      - '.github/workflows/supercompiler-cache-app.yml'
      - 'recovery/src/App/**'
      - 'recovery/tests/App/**'
      - 'recovery/scripts/BuildApp.ps1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  app:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /recovery/src/App/
            /recovery/tests/App/
            /recovery/scripts/BuildApp.ps1
      - name: Compile only the managed App contract host
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'supercompiler-cache-app'
          ./recovery/scripts/BuildApp.ps1 -Tests -Configuration Release -OutputDirectory $out
      - name: Run controlled App contracts without a native compiler or real MOD
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'supercompiler-cache-app'
          & "$out/NewModCompiler.AppTests.exe" 'C:\nsc-app-test' 2>&1 | Tee-Object -FilePath "$out/contracts.log"
          $result = $LASTEXITCODE
          @{ sourceCommit = $env:GITHUB_SHA; runId = $env:GITHUB_RUN_ID; exitCode = $result; scope = 'Managed App contracts; controlled backend only; no native build or real MOD compilation' } | ConvertTo-Json | Set-Content "$out/validation.json"
          if ($result -ne 0) { throw "App contracts failed: $result" }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: supercompiler-cache-app-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/supercompiler-cache-app/contracts.log
            ${{ runner.temp }}/supercompiler-cache-app/validation.json
          if-no-files-found: warn
