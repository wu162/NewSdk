name: Texture volume and additional format components
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  differential:
    strategy:
      fail-fast: false
      matrix:
        group: [Volume, Formats]
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 64
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Run newly recovered component only
        shell: pwsh
        run: |
          if ('${{ matrix.group }}' -eq 'Formats') {
            ./recovery/scripts/TestTextureStage2.ps1 -Group Formats
          } else {
            $prior='recovery/evidence/texture/stage2/Volume/40197368504-1'
            $receipt=Get-Content "$prior/validation.json" -Raw | ConvertFrom-Json
            git merge-base --is-ancestor $receipt.sourceCommit HEAD
            $ancestor=($LASTEXITCODE -eq 0)
            git diff --quiet $receipt.sourceCommit HEAD -- src/TextureCompiler/Managed/TextureVolume.cs recovery/tests/TextureVolumeOracle.cs src/TextureCompiler/Managed/Recovered.TextureCompiler.csproj SDK/tools/BinaryAssetBuilder.TextureCompiler.dll SDK/tools/BinaryAssetBuilder.Core.dll SDK/tools/BinaryAssetBuilder.Utility.dll
            if ($ancestor -and $LASTEXITCODE -eq 0 -and $receipt.status -eq 'passed' -and @($receipt.configurations | Where-Object passed -eq $true).Count -eq 2) {
              $out="recovery/evidence/texture/stage2/Volume/$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
              New-Item -ItemType Directory -Force $out | Out-Null
              @{status='reused';passed=$true;sourceCommit=$receipt.sourceCommit;runId=$receipt.runId;runAttempt=$receipt.runAttempt;sdkValidated=$false;checkedAtCommit=(git rev-parse HEAD).Trim()} | ConvertTo-Json | Set-Content "$out/validation.json"
              Write-Output "REUSE Volume source=$($receipt.sourceCommit) run=$($receipt.runId)-$($receipt.runAttempt); unchanged full component inputs"
            } else {
              ./recovery/scripts/TestTextureStage2.ps1 -Group Volume
            }
          }
      - name: Preserve group results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: texture-stage2-${{ matrix.group }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: recovery/evidence/texture/stage2/${{ matrix.group }}/${{ github.run_id }}-${{ github.run_attempt }}
      - name: Save immutable group evidence
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "recovery/evidence/texture/stage2/${{ matrix.group }}/$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          if (git diff --cached --quiet) { exit 0 }
          git commit -m "texture: record ${{ matrix.group }} component run $env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          if ($LASTEXITCODE -ne 0) { throw 'Evidence commit failed' }
          git pull --rebase origin $env:GITHUB_REF_NAME
          if ($LASTEXITCODE -ne 0) { throw 'Concurrent update requires resolution' }
          git push origin "HEAD:$env:GITHUB_REF_NAME"
          if ($LASTEXITCODE -ne 0) { throw 'Evidence push failed' }

