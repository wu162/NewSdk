name: Audio AIFF multichannel validation
on:
  push:
    branches: [recovery/audio-compiler-source, validation/audio-upheaval-win32]
    paths:
      - '.github/workflows/audio-multichannel-aiff-validation.yml'
      - 'recovery/scripts/TestAudioMultichannelAiff.ps1'
      - 'recovery/tests/AudioMultichannelAiffReaderOracle.cs'
      - 'src/AudioCompiler/**'
      - 'recovery/scripts/TestAudioPlugin.ps1'
      - 'recovery/scripts/TestAudioSdk.ps1'
      - 'recovery/tests/AudioMultichannelCases.cs'
      - 'recovery/tests/AudioMultichannelAiffCases.cs'
      - 'recovery/tests/AudioMultichannelBoundaryOracle.cs'
      - 'recovery/tests/AudioMultichannelDirectOracle.cs'
      - 'recovery/tests/AudioPluginOracle.cs'
      - 'recovery/tests/AudioSdkSupport.cs'
permissions:
  contents: write
concurrency:
  group: audio-multichannel-aiff-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    if: contains(github.event.head_commit.message, '[audio-multichannel-aiff]')
    runs-on: windows-2022
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install original XAS machine-code oracle dependencies
        shell: pwsh
        run: python -m pip install unicorn==2.1.4 pefile==2024.8.26
      - name: Complete new and affected ordinary plugin differential
        shell: pwsh
        run: ./recovery/scripts/TestAudioMultichannelAiff.ps1
      - name: Complete affected shared-importer regressions
        shell: pwsh
        run: |
          ./recovery/scripts/TestAudioMultichannel.ps1
          ./recovery/scripts/TestAudioAifc.ps1 -SkipSdk
          ./recovery/scripts/TestAudioAdp4Plugin.ps1
          ./recovery/scripts/TestAudioAiffSsnd.ps1 -SkipLoopRegression
          ./recovery/scripts/TestAudioLoopMetadata.ps1
          ./recovery/scripts/TestAudioLoopOptionalMetadata.ps1
          ./recovery/scripts/TestAudioAiffMarkerRange.ps1
          ./recovery/scripts/TestAudioAiffOffset.ps1
          ./recovery/scripts/TestAudioXasPrecision.ps1
          ./recovery/scripts/BuildAudioSource.ps1
      - name: Real SDK AIFF multichannel milestone after component success
        if: success()
        shell: pwsh
        run: ./recovery/scripts/TestAudioSdk.ps1 -MultichannelAiffOnly -TimeoutSeconds 900
      - name: Upload exact batch evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audio-multichannel-aiff-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          path: recovery/evidence/audio/*/${{ github.run_id }}-${{ github.run_attempt }}
      - name: Preserve exact batch evidence
        if: always()
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          $paths = @(Get-ChildItem recovery/evidence/audio -Directory | ForEach-Object { Join-Path $_.FullName "$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT" } | Where-Object { Test-Path $_ })
          if ($paths.Count -eq 0) { throw 'No multichannel evidence was produced' }
          git add -- $paths
          if ($LASTEXITCODE -ne 0) { throw 'Evidence staging failed' }
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { exit 0 }
          if ($LASTEXITCODE -ne 1) { throw 'Evidence diff failed' }
          git commit -m "audio: preserve AIFF multichannel milestone evidence $env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          if ($LASTEXITCODE -ne 0) { throw 'Evidence commit failed' }
          git pull --rebase origin $env:GITHUB_REF_NAME
          if ($LASTEXITCODE -ne 0) { throw 'Concurrent changes require resolution; artifact retained' }
          git push origin "HEAD:$env:GITHUB_REF_NAME"
          if ($LASTEXITCODE -ne 0) { throw 'Evidence push failed; artifact retained' }
