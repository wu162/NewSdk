name: Complete SDK legacy-script differential
on:
  push:
    branches: [compiler-main]
    paths:
      - '.github/workflows/compiler-sdk-real.yml'
      - 'recovery/scripts/TestCompilerSdk.ps1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: compiler-sdk-real-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false
jobs:
  sdk:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[sdk-real]')
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/recovery/evidence/
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86
      - name: Dependencies and PowerShell syntax preflight
        shell: pwsh
        run: |
          python -m pip install -r recovery/probes/TextureRedirect/requirements.txt -r recovery/scripts/app-protocol-requirements.txt lxml==6.0.2
          if($LASTEXITCODE -ne 0){throw 'Dependencies failed'}
          $tokens=$null;$errors=$null
          $null=[Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'recovery/scripts/TestCompilerSdk.ps1'),[ref]$tokens,[ref]$errors)
          if($errors.Count){$errors|Format-List|Out-Host;throw 'SDK script syntax errors'}
      - name: Fresh Debug and Release production builds
        shell: pwsh
        run: |
          foreach($mode in @('Debug','Release')) {
            ./recovery/scripts/BuildCompiler.ps1 -Configuration $mode -OutputDirectory "recovery/artifacts/sdk-real-product/$mode"
            if($LASTEXITCODE -ne 0){throw "Production build failed: $mode"}
          }
      - name: Complete untouched mymod versus original SDK script flags, caches off
        shell: pwsh
        run: |
          ./recovery/scripts/TestCompilerSdk.ps1 -CompilerDirectory recovery/artifacts/sdk-real-product -OutputDirectory "recovery/evidence/refactor/sdk-script/$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT" -TimeoutSeconds 600
          if($LASTEXITCODE -ne 0){throw 'Complete SDK differential failed'}
      - name: Validate current SDK protocol
        shell: pwsh
        run: |
          $out="recovery/evidence/refactor/sdk-script/$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          python recovery/scripts/ValidateAppProtocol.py $out --source-commit $env:GITHUB_SHA --output "$out/protocol.json"
          if($LASTEXITCODE -ne 0){throw 'SDK protocol failed'}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compiler-sdk-real-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            recovery/evidence/refactor/sdk-script/${{ github.run_id }}-${{ github.run_attempt }}
            recovery/artifacts/sdk-real-product/**/build.json
            recovery/artifacts/sdk-real-product/**/link-inputs.json
            recovery/artifacts/sdk-real-product/**/bin/*
            recovery/artifacts/sdk-real-product/**/*.log
          include-hidden-files: true
          if-no-files-found: error
