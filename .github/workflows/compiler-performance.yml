name: CLI parameter simplification validation
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cli-simplification-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/recovery/evidence/
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86
      - name: Install production build dependencies
        run: python -m pip install -r recovery/probes/TextureRedirect/requirements.txt
      - name: Release App, production build and baseline raw-byte comparison
        shell: pwsh
        run: ./work/ValidateCliSimplification.ps1 -SourceCommit 5b40ed35e638a9962f7fbcd74227e29ccc32b85d
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cli-simplification-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            recovery/artifacts/cli-simplification/app/test-app.log
            recovery/artifacts/cli-simplification/product/*.log
            recovery/artifacts/cli-simplification/product/*.json
            recovery/artifacts/cli-simplification/product/bin/*
            recovery/artifacts/cli-simplification/baseline/*.log
            recovery/artifacts/cli-simplification/baseline/*.json
            recovery/artifacts/cli-simplification/baseline/bin/*
            recovery/artifacts/cli-simplification/cases/**
            recovery/artifacts/cli-simplification/validation.json
          include-hidden-files: true
          if-no-files-found: error
