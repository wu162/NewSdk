name: CLI parameter simplification remaining SDK validation
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: cli-simplification-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/recovery/evidence/
      - name: Download exact prior successful fixture cases and runtimes
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $headers=@{Authorization=('Bearer '+$env:GH_TOKEN);Accept='application/vnd.github+json'}
          $zip=Join-Path $env:RUNNER_TEMP 'prior-fixture.zip'
          Invoke-WebRequest -Uri 'https://api.github.com/repos/wu162/NewSdk/actions/artifacts/13069851893/zip' -Headers $headers -OutFile $zip
          if((Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant() -cne 'e0b915ec8c18849c1053f6abe33813e814c1e06bfcfc3a4279af3240c3efb966'){throw 'Prior fixture artifact digest mismatch'}
          Expand-Archive -LiteralPath $zip -DestinationPath (Join-Path $env:RUNNER_TEMP 'prior-fixture')
      - name: Recheck archived results and retry only two SDK configuration cases
        shell: pwsh
        run: |
          ./work/RetryCliSdkConfig.ps1 -SourceCommit 5b40ed35e638a9962f7fbcd74227e29ccc32b85d -CandidateRuntime "$env:RUNNER_TEMP/prior-fixture/product" -BaselineRuntime "$env:RUNNER_TEMP/prior-fixture/baseline" -CandidateEvidence "$env:RUNNER_TEMP/prior-fixture"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cli-simplification-${{ github.run_id }}-${{ github.run_attempt }}
          path: recovery/artifacts/cli-simplification/**
          include-hidden-files: true
          if-no-files-found: error
