name: Bounded compiler performance instrumentation
on:
  push:
    branches: [recovery/legacy-sdk-cache]
    paths:
      - '.github/workflows/compiler-performance.yml'
      - 'recovery/src/App/**'
      - 'recovery/src/Managed/Core/**'
      - 'recovery/tests/App/**'
      - 'recovery/scripts/TestCompilerPerformance.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: compiler-performance-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false
jobs:
  profile:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[compiler-performance]')
    runs-on: windows-2022
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/recovery/evidence/
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86
      - name: Install production build and report validation dependencies
        run: python -m pip install -r recovery/probes/TextureRedirect/requirements.txt -r recovery/scripts/app-protocol-requirements.txt
      - name: Fast standalone application contracts
        shell: pwsh
        run: ./recovery/scripts/TestApp.ps1 -Configuration Release -OutputDirectory recovery/artifacts/performance-app
      - name: Rebuild Release production compiler with timing scopes
        shell: pwsh
        run: ./recovery/scripts/BuildCompiler.ps1 -Configuration Release -OutputDirectory recovery/artifacts/performance-product
      - name: Cold and hot timing levels, original bytes and packaging within 60 seconds
        timeout-minutes: 2
        shell: pwsh
        run: |
          python recovery/scripts/TestCompilerPerformance.py --exe recovery/artifacts/performance-product/bin/NewModCompiler.exe --sdk SDK --output recovery/evidence/refactor/performance --work "$env:RUNNER_TEMP/performance-work" --source-commit $env:GITHUB_SHA --budget 60 --timeout 10
          if($LASTEXITCODE -ne 0){throw 'Bounded performance validation failed'}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compiler-performance-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            recovery/evidence/refactor/performance/**
            recovery/artifacts/performance-app/*.log
            recovery/artifacts/performance-product/*.log
            recovery/artifacts/performance-product/*.json
            recovery/artifacts/performance-product/obj/foundation/*.log
            recovery/artifacts/performance-product/obj/foundation/*.json
            recovery/artifacts/performance-product/obj/native/logs/*.log
