name: CLI parameter simplification runtime validation
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: cli-simplification-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/recovery/evidence/
      - name: Download exact successful runtime artifacts
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $headers=@{Authorization=('Bearer '+$env:GH_TOKEN);Accept='application/vnd.github+json'}
          $archives=@(
            @{id='13069274015';name='candidate';sha256='df837c63493bb0df8bd973d2e502c23c1c2b5ad796cae88f98a4f3c933b46b49'},
            @{id='13069292067';name='baseline';sha256='8eaa2b2b713ce8939623a84020e4112dad4a8873e85351d1ede879f65a70a696'}
          )
          foreach($item in $archives){
            $zip=Join-Path $env:RUNNER_TEMP ($item.name+'.zip')
            Invoke-WebRequest -Uri ('https://api.github.com/repos/wu162/NewSdk/actions/artifacts/'+$item.id+'/zip') -Headers $headers -OutFile $zip
            if((Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant() -cne $item.sha256){throw ('Artifact digest mismatch: '+$item.id)}
            Expand-Archive -LiteralPath $zip -DestinationPath (Join-Path $env:RUNNER_TEMP $item.name)
          }
      - name: Resume only targeted production CLI validation
        shell: pwsh
        run: |
          ./work/ResumeCliSimplification.ps1 -SourceCommit 5b40ed35e638a9962f7fbcd74227e29ccc32b85d -CandidateRuntime "$env:RUNNER_TEMP/candidate/product" -BaselineRuntime "$env:RUNNER_TEMP/baseline/artifacts/joypad-product/Release" -CandidateEvidence "$env:RUNNER_TEMP/candidate"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cli-simplification-${{ github.run_id }}-${{ github.run_attempt }}
          path: recovery/artifacts/cli-simplification/**
          include-hidden-files: true
          if-no-files-found: error
