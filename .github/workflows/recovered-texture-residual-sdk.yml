name: Recovered Texture normalized mip residual SDK regression
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  differential:
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: PcMips
            script: TestTextureMipSdk.ps1
            arguments: ''
            evidence: sdk-mips
          - profile: VolumeMipPc
            script: TestTextureVolumeMipSdk.ps1
            arguments: '-Profile VolumeMipPc'
            evidence: sdk-volume-mips/VolumeMipPc
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build real MOD in original, recovered, no-original SDK copies
        shell: pwsh
        run: |
          & "./recovery/scripts/${{ matrix.script }}" ${{ matrix.arguments }}
      - name: Preserve group results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: texture-sdk-${{ matrix.profile }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: recovery/evidence/texture/${{ matrix.evidence }}/${{ github.run_id }}-${{ github.run_attempt }}
      - name: Save immutable group evidence
        shell: pwsh
        run: |
          ./recovery/scripts/SaveTextureEvidence.ps1 -Path "recovery/evidence/texture/${{ matrix.evidence }}/$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT" -Message "texture: record ${{ matrix.profile }} actual SDK run $env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"


