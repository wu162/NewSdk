name: MOD compiler fixed Core recovery SDK and release milestone
on:
  push:
    branches: [compiler-main, refactor/modcompiler-p0-p3]
    paths:
      - '.github/workflows/refactor-session-replay.yml'
      - 'recovery/scripts/PrepareCompilerSessionReplay.py'
      - 'recovery/scripts/TestCompilerSessionCache.ps1'
      - 'recovery/scripts/TestCompilerSdk.ps1'
      - 'recovery/scripts/TestCompilerUnicodeReplay.ps1'
      - 'recovery/scripts/PublishCompiler.ps1'
      - 'recovery/tests/CompilerUnicodeSettings.cs'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: refactor-session-replay-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false
jobs:
  replay:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[refactor-session-replay]')
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/recovery/evidence/
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Install pinned Texture audit and protocol dependencies
        shell: pwsh
        run: python -m pip install -r recovery/probes/TextureRedirect/requirements.txt -r recovery/scripts/app-protocol-requirements.txt lxml==6.0.2
      - name: Parse targeted Core SDK and package scripts before replay
        shell: pwsh
        run: |
          foreach($path in @('recovery/scripts/TestCompilerUnicodeReplay.ps1','recovery/scripts/TestCompilerSdk.ps1','recovery/scripts/PublishCompiler.ps1')) {
            $tokens=$null;$errors=$null
            $null=[Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD $path),[ref]$tokens,[ref]$errors)
            if($errors.Count -ne 0){$errors|Format-List|Out-Host;throw "PowerShell syntax errors: $path"}
          }
      - name: Verify fixed original run and prepare unchanged production bytes
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python recovery/scripts/PrepareCompilerSessionReplay.py --repo . --candidate-commit $env:GITHUB_SHA --output recovery/artifacts/session-replay-product --archive "$env:RUNNER_TEMP/session-replay.zip"
          if($LASTEXITCODE -ne 0){throw 'Fixed production session replay rejected'}
      - name: Recover the Unicode fixture and generate original BAB baseline cases
        id: core
        shell: pwsh
        run: |
          ./recovery/scripts/TestCompilerUnicodeReplay.ps1 -CompilerDirectory recovery/artifacts/session-replay-product -OutputDirectory "recovery/evidence/refactor/core-replay/$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          if($LASTEXITCODE -ne 0){throw 'Targeted Unicode and backend Core replay failed'}
      - name: Complete mymod original BAB and production SDK differential
        id: sdk
        shell: pwsh
        run: |
          ./recovery/scripts/TestCompilerSdk.ps1 -CompilerDirectory recovery/artifacts/session-replay-product -OutputDirectory "recovery/evidence/refactor/sdk-mymod/$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT" -BinarySourceCommit f2ba141284469411d604d756f7916b0cf6aecf0a -TimeoutSeconds 600
          if($LASTEXITCODE -ne 0){throw 'Complete mymod SDK differential failed'}
      - name: Validate complete mymod protocol outputs
        shell: pwsh
        run: |
          $directory="recovery/evidence/refactor/sdk-mymod/$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          python recovery/scripts/ValidateAppProtocol.py $directory --source-commit $env:GITHUB_SHA --output "$directory/protocol.json"
          if($LASTEXITCODE -ne 0){throw 'Complete mymod protocol validation failed'}
      - name: Build and validate exact-runtime Debug and Release ZIP packages
        shell: pwsh
        run: |
          ./recovery/scripts/PublishCompiler.ps1 -CompilerDirectory recovery/artifacts/session-replay-product -AcceptanceReceipt recovery/artifacts/session-replay-product/accepted-cli.json -OutputDirectory "recovery/evidence/refactor/release/$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          if($LASTEXITCODE -ne 0){throw 'Exact-runtime release ZIP validation failed'}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: refactor-session-replay-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            recovery/artifacts/session-replay-product/session-replay.json
            recovery/artifacts/session-replay-product/accepted-cli.json
            recovery/evidence/refactor/core-replay/${{ github.run_id }}-${{ github.run_attempt }}
            recovery/evidence/refactor/sdk-mymod/${{ github.run_id }}-${{ github.run_attempt }}
            recovery/evidence/refactor/release/${{ github.run_id }}-${{ github.run_attempt }}
