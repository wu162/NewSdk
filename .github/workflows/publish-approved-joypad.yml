name: Publish user-approved Joypad binaries
on:
  push:
    branches: [release/compiler-2026.11.01-harness]
    paths: ['.github/workflows/publish-approved-joypad.yml']
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: .github/release-publish
      - uses: actions/download-artifact@v4
        with:
          name: NewModCompiler-2026.11.01-joypad-review
          run-id: 41300821811
          github-token: ${{ github.token }}
          path: work/assets
      - name: Verify approved runtime bytes and source-free tag before upload and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/release-publish/compiler-2026.11.01/publish.py
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: joypad-publication-receipt-${{ github.run_id }}
          path: work/publication-receipt.json
          if-no-files-found: error
