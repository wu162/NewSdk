name: Hot edit validation repair with unchanged production
on:
  push:
    branches: [perf/compiler-cold-hot-cache]
    paths:
      - '.github/workflows/compiler-hot-edit-validation.yml'
      - 'recovery/scripts/PrepareCompilerHotEditRepair.py'
      - 'recovery/scripts/CompleteCompilerHotEditRepair.py'
      - 'recovery/scripts/TestCompilerCoreLifecycle.ps1'
      - 'recovery/scripts/TestCompilerPerformance.py'
      - 'recovery/scripts/TestCompilerBackendBaseline.ps1'
      - 'recovery/tests/CompilerInstanceIncludeCache.cs'
      - 'recovery/tests/CompilerInheritanceSnapshot.cs'
      - 'recovery/tests/CompilerReferenceSemantics.cs'
  workflow_dispatch:
    inputs:
      original_run_id:
        description: Completed Core lifecycle run with a successful original production build
        required: true
        type: string
      production_source:
        description: Exact production source SHA from that run; validation-only fixes must preserve its input closure
        required: true
        type: string
      previous_repair_run_id:
        description: Optional completed repair run containing independently successful unchanged fixtures
        required: false
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: compiler-hot-edit-repair-${{ inputs.original_run_id }}-${{ github.sha }}
  cancel-in-progress: false
jobs:
  validate:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[hot-edit-repair]')
    runs-on: windows-2022
    timeout-minutes: 50
    env:
      GH_TOKEN: ${{ github.token }}
      ORIGINAL_RUN: ${{ inputs.original_run_id || '41174952443' }}
      PRODUCTION_SOURCE: ${{ inputs.production_source || '8e8cf766df1016c6095158b62ea18f48a5c37cfe' }}
      PREVIOUS_REPAIR_RUN: ${{ github.event_name == 'push' && '41176937044' || inputs.previous_repair_run_id }}
      VALIDATION_SOURCE: ${{ github.sha }}
      COMPILER_TEST_SOURCE_COMMIT: ${{ github.sha }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/recovery/evidence/
      - name: Select original immutable artifact and retain its failed terminal status
        id: original
        shell: pwsh
        run: |
          if($env:ORIGINAL_RUN -notmatch '^\d+$' -or $env:PRODUCTION_SOURCE -notmatch '^[0-9a-f]{40}$'){throw 'Exact original run and production SHA required'}
          New-Item -ItemType Directory -Force work/hot-edit-original|Out-Null
          gh api "repos/wu162/NewSdk/actions/runs/$env:ORIGINAL_RUN" | Set-Content work/hot-edit-original/original-run.json
          if($LASTEXITCODE -ne 0){throw 'Cannot read original run'}
          $run=Get-Content work/hot-edit-original/original-run.json -Raw|ConvertFrom-Json
          if($run.head_sha -cne $env:PRODUCTION_SOURCE -or $run.status -ne 'completed' -or $run.path -ne '.github/workflows/refactor-core-lifecycle.yml'){throw 'Original run identity differs'}
          gh api "repos/wu162/NewSdk/actions/runs/$env:ORIGINAL_RUN/jobs?per_page=100" | Set-Content work/hot-edit-original/original-jobs.json
          if($LASTEXITCODE -ne 0){throw 'Cannot read original gate results'}
          $listing=gh api "repos/wu162/NewSdk/actions/runs/$env:ORIGINAL_RUN/artifacts?per_page=100" | ConvertFrom-Json
          if($LASTEXITCODE -ne 0){throw 'Cannot read original artifacts'}
          $name="refactor-core-lifecycle-$env:ORIGINAL_RUN-$($run.run_attempt)"
          $artifact=@($listing.artifacts|Where-Object{$_.name -ceq $name -and !$_.expired})
          if($artifact.Count -ne 1){throw 'Expected exactly one original production artifact'}
          $artifact[0]|ConvertTo-Json -Depth 12|Set-Content work/hot-edit-original/original-artifact.json
          "artifact=$name"|Add-Content $env:GITHUB_OUTPUT
      - uses: actions/download-artifact@v4
        with:
          name: ${{ steps.original.outputs.artifact }}
          run-id: ${{ env.ORIGINAL_RUN }}
          github-token: ${{ github.token }}
          path: work/hot-edit-original
      - name: Select prior independent successful fixture evidence
        if: env.PREVIOUS_REPAIR_RUN != ''
        id: previous
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force work/hot-edit-previous|Out-Null
          gh api "repos/wu162/NewSdk/actions/runs/$env:PREVIOUS_REPAIR_RUN" | Set-Content work/hot-edit-previous/previous-run.json
          if($LASTEXITCODE -ne 0){throw 'Cannot read previous repair run'}
          $run=Get-Content work/hot-edit-previous/previous-run.json -Raw|ConvertFrom-Json
          $listing=gh api "repos/wu162/NewSdk/actions/runs/$env:PREVIOUS_REPAIR_RUN/artifacts?per_page=100" | ConvertFrom-Json
          if($LASTEXITCODE -ne 0){throw 'Cannot read previous repair artifacts'}
          $name="compiler-hot-edit-validation-$env:PREVIOUS_REPAIR_RUN-$($run.run_attempt)"
          $artifact=@($listing.artifacts|Where-Object{$_.name -ceq $name -and !$_.expired})
          if($artifact.Count -ne 1){throw 'Expected exactly one previous fixture artifact'}
          $artifact[0]|ConvertTo-Json -Depth 12|Set-Content work/hot-edit-previous/previous-artifact.json
          "artifact=$name"|Add-Content $env:GITHUB_OUTPUT
      - uses: actions/download-artifact@v4
        if: env.PREVIOUS_REPAIR_RUN != ''
        with:
          name: ${{ steps.previous.outputs.artifact }}
          run-id: ${{ env.PREVIOUS_REPAIR_RUN }}
          github-token: ${{ github.token }}
          path: work/hot-edit-previous
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86
      - name: Install unchanged validation dependencies
        shell: pwsh
        run: python -m pip install -r recovery/probes/TextureRedirect/requirements.txt -r recovery/scripts/app-protocol-requirements.txt lxml==6.0.2
      - name: Verify production closure and overlay only explicit validation repairs
        id: prepare
        shell: pwsh
        run: |
          $previous=@()
          if($env:PREVIOUS_REPAIR_RUN){$previous=@('--previous-repair-root','work/hot-edit-previous')}
          python recovery/scripts/PrepareCompilerHotEditRepair.py --repo . --original-root work/hot-edit-original --output "recovery/evidence/refactor/hot-edit-repair/$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT" --production-source $env:PRODUCTION_SOURCE --validation-source $env:VALIDATION_SOURCE --original-run $env:ORIGINAL_RUN @previous
          if($LASTEXITCODE -ne 0){throw 'Unchanged production reuse was rejected'}
      - name: Repair only failed or changed Core fixtures in Debug and Release
        id: core
        env:
          FIXTURES: ${{ steps.prepare.outputs.fixtures }}
        shell: pwsh
        run: |
          ./recovery/scripts/TestCompilerCoreLifecycle.ps1 -CompilerDirectory recovery/artifacts/core-lifecycle-product -OutputDirectory "recovery/evidence/refactor/core-lifecycle/$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT" -FixtureNames ($env:FIXTURES -split ',')
      - name: Repaired existing bounded performance gate without rebuilding
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        id: performance
        timeout-minutes: 2
        shell: pwsh
        run: |
          python recovery/scripts/TestCompilerPerformance.py --exe recovery/artifacts/core-lifecycle-product/Release/bin/NewModCompiler.exe --sdk SDK --output "recovery/evidence/refactor/performance/$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT" --work "$env:RUNNER_TEMP/performance-repair" --source-commit $env:PRODUCTION_SOURCE --budget 60 --timeout 10
          if($LASTEXITCODE -ne 0){throw 'Bounded performance gate still failed'}
      - name: Complete missing original BAB oracles using transported successful fixture inputs
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        id: bab
        shell: pwsh
        run: |
          $prep="recovery/evidence/refactor/hot-edit-repair/$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          foreach($mode in @('Debug','Release')){
            ./recovery/scripts/TestCompilerBackendBaseline.ps1 -FixtureResult "$prep/$mode-backend-transport.json" -FixtureRunId $env:ORIGINAL_RUN -OutputDirectory "recovery/evidence/refactor/core-backend-baseline/$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT/$mode" -TimeoutSeconds 180
          }
      - name: Validate original successful application fixture outputs against current protocol
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        id: protocol
        shell: pwsh
        run: |
          $original=Get-Content work/hot-edit-original/original-run.json -Raw|ConvertFrom-Json
          $path="work/hot-edit-original/evidence/refactor/core-lifecycle/$env:ORIGINAL_RUN-$($original.run_attempt)"
          python recovery/scripts/ValidateAppProtocol.py $path --source-commit $env:PRODUCTION_SOURCE --output "recovery/evidence/refactor/hot-edit-repair/$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT/original-core-protocol.json"
          if($LASTEXITCODE -ne 0){throw 'Original application fixture public protocol failed'}
      - name: Complete previously unexecuted unchanged mymod original SDK differential
        if: ${{ !cancelled() && steps.core.outcome == 'success' && steps.performance.outcome == 'success' && steps.bab.outcome == 'success' && steps.protocol.outcome == 'success' }}
        shell: pwsh
        run: |
          ./recovery/scripts/TestCompilerSdk.ps1 -CompilerDirectory recovery/artifacts/core-lifecycle-product -OutputDirectory "recovery/evidence/refactor/sdk-mymod/$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT" -TimeoutSeconds 600
          if($LASTEXITCODE -ne 0){throw 'Complete mymod SDK differential failed'}
      - name: Publish exact five-file packages after composed production acceptance
        shell: pwsh
        run: |
          $original=Get-Content work/hot-edit-original/original-run.json -Raw|ConvertFrom-Json
          $cli="work/hot-edit-original/evidence/refactor/core-cli/$env:ORIGINAL_RUN-$($original.run_attempt)/validation.json"
          ./recovery/scripts/PublishCompiler.ps1 -CompilerDirectory recovery/artifacts/core-lifecycle-product -AcceptanceReceipt $cli -VerifyBigDeployment -OutputDirectory "recovery/artifacts/final-release/$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          if($LASTEXITCODE -ne 0){throw 'Five-file ZIP deployment validation failed'}
      - name: Complete previously unexecuted full Upheaval matrix
        timeout-minutes: 24
        shell: pwsh
        run: |
          python recovery/scripts/MeasureCompilerParallel.py --repo . --exe recovery/artifacts/core-lifecycle-product/Release/bin/NewModCompiler.exe --work "$env:RUNNER_TEMP/upheaval-hot-edit-repair" --output "recovery/evidence/refactor/backend-parallel-performance/$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT" --source-commit $env:PRODUCTION_SOURCE --binary-source-commit $env:PRODUCTION_SOURCE --timeout 240 --budget 1320
          if($LASTEXITCODE -ne 0){throw 'Complete Upheaval matrix failed; original terminal state retained'}
      - name: Verify composed acceptance and unchanged runtime identities
        shell: pwsh
        run: |
          $out="recovery/evidence/refactor/hot-edit-repair/$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          python work/hot-edit-repair-tools/CompleteCompilerHotEditRepair.py --repo . --preparation "$out/preparation.json" --output $out
          if($LASTEXITCODE -ne 0){throw 'Composed hot-edit acceptance was rejected'}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compiler-hot-edit-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            recovery/evidence/refactor/hot-edit-repair/${{ github.run_id }}-${{ github.run_attempt }}
            recovery/evidence/refactor/core-lifecycle/${{ github.run_id }}-${{ github.run_attempt }}
            recovery/evidence/refactor/core-backend-baseline/${{ github.run_id }}-${{ github.run_attempt }}
            recovery/evidence/refactor/performance/${{ github.run_id }}-${{ github.run_attempt }}
            recovery/evidence/refactor/sdk-mymod/${{ github.run_id }}-${{ github.run_attempt }}
            recovery/evidence/refactor/backend-parallel-performance/${{ github.run_id }}-${{ github.run_attempt }}
            recovery/artifacts/final-release/${{ github.run_id }}-${{ github.run_attempt }}
            recovery/artifacts/core-lifecycle-product/**/build.json
            recovery/artifacts/core-lifecycle-product/**/link-inputs.json
            recovery/artifacts/core-lifecycle-product/**/bin/*
          include-hidden-files: true
          if-no-files-found: error
