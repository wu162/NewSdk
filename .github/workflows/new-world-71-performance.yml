name: The New World 7.1 original and new SDK benchmark
on:
  push:
    branches: [benchmark/new-world-71-sdk]
    paths:
      - '.github/workflows/new-world-71-performance.yml'
      - 'recovery/scripts/DownloadNewWorld71.py'
      - 'recovery/scripts/MeasureCompilerOriginalMod.py'
  workflow_dispatch:
    inputs:
      source_url:
        description: 'Fresh official ModDB mirror redirect; archive size and MD5 remain pinned'
        type: string
        required: false
      components_only:
        description: 'Independently measure all APT and global-data entries when base hits an unsupported type'
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  group: new-world-71-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false
jobs:
  measure:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[new-world-benchmark]')
    runs-on: windows-2022
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/recovery/evidence/
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86
      - name: Verify accepted Release source and measurement syntax
        shell: pwsh
        run: |
          $run=gh api repos/wu162/NewSdk/actions/runs/41244132060 | ConvertFrom-Json
          if($LASTEXITCODE -ne 0 -or $run.status -ne 'completed' -or $run.conclusion -ne 'success' -or $run.head_sha -cne '8050f22de81539c65aeca3903e9b48f53a572068' -or $run.run_attempt -ne 1){throw 'Accepted production source/run differs'}
          python -m py_compile recovery/scripts/MeasureCompilerOriginalMod.py recovery/scripts/DownloadNewWorld71.py recovery/scripts/BenchmarkCompilerSdkComparison.py
          if($LASTEXITCODE -ne 0){throw 'Measurement script syntax failed'}
      - uses: actions/download-artifact@v4
        with:
          name: refactor-core-lifecycle-41244132060-1
          run-id: 41244132060
          github-token: ${{ github.token }}
          path: work/new-world-accepted
      - name: Download and verify complete 7.1 source under SDK Mods
        shell: pwsh
        env:
          NEW_WORLD_SOURCE_URL: ${{ inputs.source_url }}
        run: |
          $arguments=@('recovery/scripts/DownloadNewWorld71.py','--sdk-root','SDK','--archive',"$env:RUNNER_TEMP/The_New_World_7.1Source_Code.7z",'--output',"recovery/evidence/refactor/new-world-71/$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT/source.json")
          if($env:NEW_WORLD_SOURCE_URL){$arguments+=@('--source-url',$env:NEW_WORLD_SOURCE_URL)}
          python @arguments
          if($LASTEXITCODE -ne 0){throw 'Source download or extraction failed'}
      - name: Compile all entries in selected content groups with paired cold hot and optional XML edit measurements
        shell: pwsh
        env:
          NEW_WORLD_COMPONENTS_ONLY: ${{ inputs.components_only }}
        run: |
          $out="recovery/evidence/refactor/new-world-71/$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT/measurement"
          $contents=if($env:NEW_WORLD_COMPONENTS_ONLY -eq 'true'){@('apt','global-metadata')}else{@('base,apt,global-metadata')}
          $results=@()
          foreach($content in $contents){
            $currentOut=if($contents.Count -eq 1){$out}else{"$out/$content"}
            $arguments=@('recovery/scripts/MeasureCompilerOriginalMod.py','--accepted-build','work/new-world-accepted/artifacts/core-lifecycle-product/Release','--mod','SDK/Mods/The New World','--mod-schema','SDK/Mods/The New World/xsd','--content',$content,'--requested-head','c7647a130c779e84b3ec669cb7235599488048b2','--work',"$env:RUNNER_TEMP/new-world-benchmark-$content",'--output',$currentOut,'--skip-extra-uncached')
            if($env:NEW_WORLD_COMPONENTS_ONLY -eq 'true'){
              $arguments+=@('--pairs','3','--timeout-seconds','300','--budget-seconds','900')
            }else{
              $arguments+=@('--edit-file','Data/AutoAndBoat/AM_BOAT03.xml','--edit-old','MaxHealth="300"','--edit-new','MaxHealth="301"','--pairs','1','--rebuild-check','asset','--timeout-seconds','3600','--budget-seconds','5400')
            }
            python @arguments
            $results+=@($LASTEXITCODE)
            if(Test-Path "$currentOut/report.md"){Get-Content "$currentOut/report.md" -Encoding UTF8 | Add-Content $env:GITHUB_STEP_SUMMARY}
          }
          if(@($results|Where-Object{$_ -ne 0}).Count){throw 'Benchmark did not fully pass; raw results retained'}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: new-world-71-performance-${{ github.run_id }}-${{ github.run_attempt }}
          path: recovery/evidence/refactor/new-world-71/${{ github.run_id }}-${{ github.run_attempt }}/**
          if-no-files-found: error
