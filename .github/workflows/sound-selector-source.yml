name: Export GameObject module source evidence
on:
  push:
    branches: [recovery/compiler-source]
    paths:
      - 'recovery/scripts/ExportSoundSelectorMethods.py'
      - 'recovery/scripts/ExportLifecycleMethods.py'
      - 'recovery/scripts/GenerateLifecycleFields.py'
      - 'recovery/scripts/GenerateDieFields.py'
      - 'recovery/scripts/GenerateUpgradeFields.py'
      - 'recovery/scripts/GenerateUpgradeRemaining.py'
      - '.github/workflows/sound-selector-source.yml'
permissions:
  contents: write
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check original fingerprint and export exact methods
        run: |
          python recovery/scripts/ExtractSoundSelectorEvidence.py --check
          python recovery/scripts/ExportSoundSelectorMethods.py
          python recovery/scripts/ExportLifecycleMethods.py
          python recovery/scripts/ExportLifecycleMethods.py --die-family
          python recovery/scripts/ExportLifecycleMethods.py --upgrade-family
          python recovery/scripts/ExportLifecycleMethods.py --upgrade-remaining
          python recovery/scripts/ExportLifecycleMethods.py --production-family
          python recovery/scripts/GenerateLifecycleFields.py
          python recovery/scripts/GenerateLifecycleFields.py --check
          python recovery/scripts/GenerateDieFields.py
          python recovery/scripts/GenerateDieFields.py --check
          python recovery/scripts/GenerateUpgradeFields.py
          python recovery/scripts/GenerateUpgradeFields.py --check
          python recovery/scripts/GenerateUpgradeRemaining.py
          python recovery/scripts/GenerateUpgradeRemaining.py --check
      - name: Save bounded source evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add recovery/evidence/gameobject-modules/sound-selector-methods recovery/evidence/gameobject-modules/lifecycle-source recovery/evidence/gameobject-modules/die-source recovery/evidence/gameobject-modules/upgrade-source recovery/evidence/gameobject-modules/upgrade-remaining-source recovery/evidence/gameobject-modules/production-source recovery/src/Native/GameObjectLifecycle.h recovery/src/Native/GameObjectDie.h recovery/src/Native/GameObjectUpgrade.h recovery/src/Native/GameObjectUpgradeRemaining.h
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "recovery: export module source methods from $GITHUB_SHA"
          git pull --rebase origin recovery/compiler-source
          git push origin HEAD:recovery/compiler-source
