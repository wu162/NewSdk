name: Export sound selector source evidence
on:
  push:
    branches: [recovery/compiler-source]
    paths:
      - 'recovery/scripts/ExportSoundSelectorMethods.py'
      - '.github/workflows/sound-selector-source.yml'
permissions:
  contents: write
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check original fingerprint and export exact methods
        run: |
          python recovery/scripts/ExtractSoundSelectorEvidence.py --check
          python recovery/scripts/ExportSoundSelectorMethods.py
      - name: Save bounded source evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add recovery/evidence/gameobject-modules/sound-selector-methods
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "recovery: export selector source methods from $GITHUB_SHA"
          git pull --rebase origin recovery/compiler-source
          git push origin HEAD:recovery/compiler-source
