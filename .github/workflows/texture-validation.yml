name: Texture batched validation
on:
  push:
    branches: [recovery/texturecompiler-source, validation/texture-public-ppm, validation/texture-public-jpeg, validation/texture-public-s3, validation/texture-public-s3-dxt1, validation/texture-public-native-npot, validation/texture-public-d3dx-bc]
    paths:
      - 'src/TextureCompiler/**'
      - 'SDK/tools/**'
      - 'SDK/Schemas/**'
      - 'global.json'
      - 'Directory.Build.*'
      - 'NuGet.Config'
      - 'recovery/tests/Texture*'
      - 'recovery/tests/TestTextureSelection.py'
      - 'recovery/tests/TestTextureEvidenceStorage.py'
      - 'recovery/tests/fixtures/texture-main/**'
      - 'recovery/scripts/TestTexture*'
      - 'recovery/scripts/BuildTexture*'
      - 'recovery/scripts/InspectTexture*'
      - 'recovery/scripts/PackTexture*'
      - 'recovery/reference/ijg6b/**'
      - 'recovery/reference/compact-icc/**'
      - 'recovery/scripts/SelectTextureGroups.py'
      - 'recovery/scripts/RunTextureBatch.ps1'
      - 'recovery/catalog/TextureTestGroups.json'
      - 'recovery/RESUME.md'
      - '.github/workflows/texture-validation.yml'
  workflow_dispatch:
    inputs:
      force_groups:
        description: 'auto, or comma-separated group names to force; unchanged other groups are reused'
        default: auto
      run_sdk:
        description: 'Include affected SDK profiles'
        type: boolean
        default: false
      plan_only:
        description: 'Inspect selection without running Windows tests'
        type: boolean
        default: false
      native_bc_build_only:
        description: 'Compile native BC integration and hosts only; no differential/NoOriginal/SDK acceptance'
        type: boolean
        default: false
      deploy_pc:
        description: 'After current PPM/full-mymod gates pass, activate their identical six-DLL package in SDK'
        type: boolean
        default: false
permissions:
  contents: write
  actions: write
jobs:
  plan:
    if: inputs.native_bc_build_only != true && (contains(github.event.head_commit.message, '[texture-public-bc]') || contains(github.event.head_commit.message, '[texture-ppm-sdk]') || contains(github.event.head_commit.message, '[texture-ppm-load]') || contains(github.event.head_commit.message, '[texture-dib-sdk]') || github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[texture-test]') || contains(github.event.head_commit.message, '[texture-sdk]') || contains(github.event.head_commit.message, '[texture-plan]') || contains(github.event.head_commit.message, '[texture-bmp-bitfields]') || contains(github.event.head_commit.message, '[texture-bmp-headers]') || contains(github.event.head_commit.message, '[texture-tga-metadata]') || contains(github.event.head_commit.message, '[texture-jpeg-metadata]') || contains(github.event.head_commit.message, '[texture-png-order]') || contains(github.event.head_commit.message, '[texture-png-metadata]') || contains(github.event.head_commit.message, '[texture-s3-dxt1a]') || contains(github.event.head_commit.message, '[texture-s3-three]') || contains(github.event.head_commit.message, '[texture-dxt1-boundary]') || contains(github.event.head_commit.message, '[texture-dxt-evidence]') || contains(github.event.head_commit.message, '[texture-dxt-blocks]') || contains(github.event.head_commit.message, '[texture-dxt-volume-boundaries]') || contains(github.event.head_commit.message, '[texture-npot-load]') || contains(github.event.head_commit.message, '[texture-npot-numeric]') || contains(github.event.head_commit.message, '[texture-npot-storage]') || contains(github.event.head_commit.message, '[texture-npot-formats]') || contains(github.event.head_commit.message, '[texture-next-probes]') || contains(github.event.head_commit.message, '[texture-jpeg-load]') || contains(github.event.head_commit.message, '[texture-atlas-load]') || contains(github.event.head_commit.message, '[texture-npot-storage-stress]'))
    runs-on: ubuntu-latest
    outputs:
      has_work: ${{ steps.select.outputs.has_work }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify dependency selection boundaries
        run: python recovery/tests/TestTextureSelection.py
      - name: Verify lossless SDK evidence storage
        run: python recovery/tests/TestTextureEvidenceStorage.py
      - name: Select affected groups and preserve original acceptance anchors
        id: select
        env:
          FORCE_GROUPS: ${{ inputs.force_groups || (contains(github.event.head_commit.message, '[texture-public-bc]') && 'public-d3dx-bc') || (contains(github.event.head_commit.message, '[texture-ppm-sdk]') && 'sdk-PcPpm') || (contains(github.event.head_commit.message, '[texture-ppm-load]') && 'ppm-load') || (contains(github.event.head_commit.message, '[texture-dib-sdk]') && 'sdk-PcDib') || (contains(github.event.head_commit.message, '[texture-bmp-bitfields]') && 'bmp-bitfields-load') || (contains(github.event.head_commit.message, '[texture-bmp-headers]') && 'bmp-header-load') || (contains(github.event.head_commit.message, '[texture-tga-metadata]') && 'tga-metadata-load') || (contains(github.event.head_commit.message, '[texture-jpeg-metadata]') && 'jpeg-metadata-load') || (contains(github.event.head_commit.message, '[texture-png-order]') && 'png-metadata-order') || (contains(github.event.head_commit.message, '[texture-png-metadata]') && 'png-metadata-load') || (contains(github.event.head_commit.message, '[texture-s3-dxt1a]') && 'public-s3-dxt1a,public-s3-dxt1a-dds') || (contains(github.event.head_commit.message, '[texture-s3-three]') && 'public-s3-three') || (contains(github.event.head_commit.message, '[texture-dxt1-boundary]') && 'dxt1-boundary') || (contains(github.event.head_commit.message, '[texture-jpeg-load]') && 'jpeg-load') || (contains(github.event.head_commit.message, '[texture-atlas-load]') && 'atlas-load') || (contains(github.event.head_commit.message, '[texture-npot-storage-stress]') && 'npot-storage-stress') || (contains(github.event.head_commit.message, '[texture-next-probes]') && 'npot-storage-stress,atlas-prerequisites') || (contains(github.event.head_commit.message, '[texture-npot-formats]') && 'npot-formats') || (contains(github.event.head_commit.message, '[texture-npot-storage]') && 'npot-storage') || (contains(github.event.head_commit.message, '[texture-npot-numeric]') && 'npot-numeric') || (contains(github.event.head_commit.message, '[texture-npot-load]') && 'npot-load') || (contains(github.event.head_commit.message, '[texture-dxt-volume-boundaries]') && 'dxt-volume-boundaries') || (contains(github.event.head_commit.message, '[texture-dxt-blocks]') && 'dxt-blocks') || (contains(github.event.head_commit.message, '[texture-dxt-evidence]') && 'dxt-symbols') || 'auto' }}
          REQUEST_SDK: ${{ inputs.run_sdk || contains(github.event.head_commit.message, '[texture-sdk]') }}
          ONLY_PLAN: ${{ inputs.plan_only || contains(github.event.head_commit.message, '[texture-plan]') }}
          DEPLOY_PC: ${{ inputs.deploy_pc || false }}
        run: |
          if [[ "$DEPLOY_PC" == true ]]; then
            if [[ "$ONLY_PLAN" == true ]]; then echo 'Deployment requires actual SDK tests'; exit 1; fi
            if [[ "$FORCE_GROUPS" == auto ]]; then FORCE_GROUPS='sdk-PcPpm,sdk-PcMymod'; else FORCE_GROUPS="$FORCE_GROUPS,sdk-PcPpm,sdk-PcMymod"; fi
          fi
          args=(--out plan.json --groups "$FORCE_GROUPS")
          if [[ "$REQUEST_SDK" == true ]]; then args+=(--sdk); fi
          python recovery/scripts/SelectTextureGroups.py "${args[@]}"
          python recovery/scripts/InspectTextureNpotGold.py --plan plan.json --windows-checkout --out npot-preflight.json
          python - <<'PY'
          import json, os
          row=json.load(open('plan.json'))
          enabled=bool(row['selected']) and os.environ['ONLY_PLAN']!='true'
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('has_work='+str(enabled).lower()+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: texture-plan-${{ github.run_id }}
          path: |
            plan.json
            npot-preflight.json
  validate:
    needs: plan
    if: needs.plan.outputs.has_work == 'true'
    runs-on: windows-2022
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: texture-plan-${{ github.run_id }}
          path: recovery/texture-plan
      - name: Preflight selected immutable inputs before builds
        shell: pwsh
        run: python recovery/scripts/InspectTextureNpotGold.py --plan recovery/texture-plan/plan.json --out recovery/texture-plan/npot-checkout-preflight.json
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86
      - name: Run new capability complete groups first
        id: early
        shell: pwsh
        run: ./recovery/scripts/RunTextureBatch.ps1 -Phase priority
      - name: Preserve early complete capability outputs
        if: always() && steps.early.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: texture-early-${{ github.run_id }}-${{ github.run_attempt }}
          path: recovery/evidence/texture/**/${{ github.run_id }}-${{ github.run_attempt }}/**
      - name: Complete remaining affected groups serially
        if: always() && steps.early.outcome != 'skipped'
        id: tests
        shell: pwsh
        run: ./recovery/scripts/RunTextureBatch.ps1 -Phase remaining
      - name: Activate the fully tested PC package and preserve portable rollback
        if: inputs.deploy_pc && steps.early.outcome == 'success' && steps.tests.outcome == 'success'
        id: deploy
        shell: pwsh
        run: ./recovery/scripts/DeployTextureCompiler.ps1
      - name: Preserve actual group outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: texture-batch-${{ github.run_id }}-${{ github.run_attempt }}
          path: recovery/evidence/texture/**/${{ github.run_id }}-${{ github.run_attempt }}/**
      - name: Persist evidence using an ordinary push
        if: always() && steps.tests.outcome != 'skipped'
        shell: pwsh
        run: |
          if ('${{ steps.deploy.outcome }}' -eq 'success') {
            ./recovery/scripts/SaveTextureEvidence.ps1 -Path recovery/evidence/texture -AdditionalPaths @('SDK/RecoveryTexture', 'SDK/tools/Recovered.*.dll', 'SDK/tools/BinaryAssetBuilder.exe.config', 'SDK/tools/.gitattributes') -Message "texture: activate accepted PC package and validate changed SDK inputs $env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT [texture-test]"
          } else {
            ./recovery/scripts/SaveTextureEvidence.ps1 -Path recovery/evidence/texture -Message "texture: record batch $env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          }
      - name: Validate every affected component after SDK deployment
        if: steps.deploy.outcome == 'success'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run texture-validation.yml --repo $env:GITHUB_REPOSITORY --ref $env:GITHUB_REF_NAME -f force_groups=auto -f run_sdk=false -f plan_only=false -f deploy_pc=false


  native-bc-build:
    if: github.event_name == 'workflow_dispatch' && inputs.native_bc_build_only == true
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86
      - name: Compile both native BC configurations and contract hosts only
        shell: pwsh
        run: ./recovery/scripts/BuildTextureNativeBcIntegration.ps1
      - name: Verify changed dependency selection boundaries
        run: python recovery/tests/TestTextureSelection.py
      - name: Preserve compilation diagnostics (not acceptance)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: texture-native-bc-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: recovery/evidence/texture/native-bc-build/${{ github.run_id }}-${{ github.run_attempt }}
      - name: Save compilation diagnostics with an ordinary push
        if: always()
        shell: pwsh
        run: ./recovery/scripts/SaveTextureEvidence.ps1 -Path "recovery/evidence/texture/native-bc-build/$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT" -Message "texture: record native BC compile-only diagnostics $env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
