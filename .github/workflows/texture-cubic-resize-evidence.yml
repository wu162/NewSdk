name: Texture original cubic resize evidence
on:
  push:
    branches: [recovery/texturecompiler-source]
    paths:
      - 'recovery/tests/TextureCubicResizeProbe.cs'
      - 'recovery/scripts/InspectTextureCubicResize.ps1'
      - '.github/workflows/texture-cubic-resize-evidence.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  differential:
    strategy:
      fail-fast: false
      matrix:
        group: [CubicResizeProbe]
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Inspect original cubic resize output; no recovered acceptance
        shell: pwsh
        run: |
          ./recovery/scripts/InspectTextureCubicResize.ps1
      - name: Preserve group results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: texture-stage2-${{ matrix.group }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: recovery/evidence/texture/cubic-resize-probe/${{ github.run_id }}-${{ github.run_attempt }}
      - name: Save immutable group evidence
        shell: pwsh
        run: |
          ./recovery/scripts/SaveTextureEvidence.ps1 -Path "recovery/evidence/texture/cubic-resize-probe/$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT" -Message "texture: record original cubic resize probe run $env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
