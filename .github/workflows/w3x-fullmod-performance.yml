name: Full Upheaval W3X compression paired builds
on:
  push:
    branches: [optimize/w3d-animation-compression]
    paths:
      - '.github/workflows/w3x-fullmod-performance.yml'
      - 'recovery/scripts/MeasureW3xFullMod.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: w3x-fullmod-${{ github.ref }}
  cancel-in-progress: false
jobs:
  measure:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/recovery/evidence/
      - uses: actions/checkout@v4
        with:
          ref: 436115db594c405c1650d27754594454eed54bdc
          path: baseline-source
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/recovery/evidence/
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86
      - name: Install existing build dependencies
        run: python -m pip install -r recovery/probes/TextureRedirect/requirements.txt
      - name: Rebuild baseline Release from exact parent source
        shell: pwsh
        run: ./baseline-source/recovery/scripts/BuildCompiler.ps1 -Configuration Release -OutputDirectory "${{ github.workspace }}/recovery/artifacts/w3x-fullmod-baseline"
      - uses: actions/download-artifact@v4
        with:
          name: w3x-compression-41003661518-1
          run-id: 41003661518
          github-token: ${{ github.token }}
          path: recovery/artifacts/w3x-accepted
      - name: Two paired full MOD builds with identical published bytes
        shell: pwsh
        run: python recovery/scripts/MeasureW3xFullMod.py --baseline-build recovery/artifacts/w3x-fullmod-baseline --optimized-build recovery/artifacts/w3x-accepted/artifacts/w3x-compression-product/Release --work "$env:RUNNER_TEMP/w3x-fullmod" --output "recovery/evidence/w3x/fullmod-compression/$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: w3x-fullmod-compression-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            recovery/evidence/w3x/fullmod-compression/${{ github.run_id }}-${{ github.run_attempt }}
            recovery/artifacts/w3x-fullmod-baseline/build.json
            recovery/artifacts/w3x-fullmod-baseline/**/*.log
          if-no-files-found: error
