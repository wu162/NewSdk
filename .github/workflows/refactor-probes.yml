name: MOD compiler isolated probes
on:
  push:
    branches: [refactor/modcompiler-p0-p3]
    paths:
      - '.github/workflows/refactor-probes.yml'
      - 'recovery/probes/**'
      - 'recovery/build/**'
      - 'recovery/src/App/**'
      - 'recovery/tests/App/**'
      - 'recovery/scripts/*SingleExeProbe.ps1'
      - 'recovery/scripts/*ManagedFoundation.ps1'
      - 'recovery/scripts/*App.ps1'
      - 'recovery/scripts/TestTextureRedirect.ps1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  app-contract:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[refactor-probes]') || contains(github.event.head_commit.message, '[refactor-app]')
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: CLI plan, lifecycle and durable events in Debug and Release
        shell: pwsh
        run: |
          ./recovery/scripts/TestApp.ps1 -Configuration Debug
          ./recovery/scripts/TestApp.ps1 -Configuration Release
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: refactor-app-${{ github.run_id }}-${{ github.run_attempt }}
          path: recovery/artifacts/app
          if-no-files-found: error
  link-probe:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[refactor-probes]') || contains(github.event.head_commit.message, '[refactor-link]')
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86
      - name: Real Armor and Hash unified-link differential
        shell: pwsh
        run: ./recovery/scripts/TestSingleExeProbe.ps1 -OutputDirectory "recovery/evidence/refactor/g1/$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT" -Minimal
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: refactor-link-${{ github.run_id }}-${{ github.run_attempt }}
          path: recovery/evidence/refactor/g1/${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
  texture-roundtrip:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[refactor-probes]') || contains(github.event.head_commit.message, '[refactor-texture]')
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Texture original and native-writer roundtrip
        shell: pwsh
        run: |
          python -m pip install -r recovery/probes/TextureRedirect/requirements.txt
          if($LASTEXITCODE -ne 0){throw 'PE audit dependencies failed'}
          ./recovery/scripts/TestTextureRedirect.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: refactor-texture-${{ github.run_id }}-${{ github.run_attempt }}
          path: recovery/evidence/refactor/g2-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
