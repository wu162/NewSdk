name: Public texture codec comparison
on:
  push:
    branches: [validation/texture-public-codecs]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  compare:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[public-s3-diagnose]') || contains(github.event.head_commit.message, '[public-codecs-test]') || contains(github.event.head_commit.message, '[public-codecs-amd]') || contains(github.event.head_commit.message, '[public-codecs-patch]') || contains(github.event.head_commit.message, '[public-codecs-s3]') || contains(github.event.head_commit.message, '[public-codecs-s3-x87]')
    runs-on: windows-2022
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86
      - name: Compare copied public source against original gold
        id: tests
        shell: pwsh
        env:
          DIAGNOSE: ${{ contains(github.event.head_commit.message, '[public-s3-diagnose]') }}
          PATCHED: ${{ contains(github.event.head_commit.message, '[public-codecs-patch]') }}
          S3_X87: ${{ contains(github.event.head_commit.message, '[public-codecs-s3-x87]') }}
          ONLY_S3: ${{ contains(github.event.head_commit.message, '[public-codecs-s3]') }}
          ONLY_AMD: ${{ contains(github.event.head_commit.message, '[public-codecs-amd]') }}
        run: |
          if($env:DIAGNOSE -eq 'true'){./recovery/scripts/DiagnoseTexturePublicS3.ps1}elseif($env:S3_X87 -eq 'true'){./recovery/scripts/TestTexturePublicCodecs.ps1 -OnlyS3 -X87}elseif($env:ONLY_S3 -eq 'true'){./recovery/scripts/TestTexturePublicCodecs.ps1 -OnlyS3}elseif($env:PATCHED -eq 'true'){./recovery/scripts/TestTexturePublicCodecs.ps1 -Patched}elseif($env:ONLY_AMD -eq 'true'){./recovery/scripts/TestTexturePublicCodecs.ps1 -OnlyAmd}else{./recovery/scripts/TestTexturePublicCodecs.ps1}
      - name: Preserve complete comparison results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-codecs-${{ github.run_id }}-${{ github.run_attempt }}
          path: recovery/evidence/texture/public-codecs/${{ github.run_id }}-${{ github.run_attempt }}/**
      - name: Save evidence on the test branch
        if: always() && steps.tests.outcome != 'skipped'
        shell: pwsh
        run: |
          ./recovery/scripts/SaveTextureEvidence.ps1 -Path recovery/evidence/texture/public-codecs -Message "texture: record public codec comparison $env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
