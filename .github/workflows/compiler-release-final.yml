name: Finish compiler release verification
on:
  push:
    branches: [release/compiler-2026.11.01-harness]
    paths:
      - '.github/workflows/compiler-release-final.yml'
      - 'recovery/tests/CompilerXmlBackendBatch.cs'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  final:
    runs-on: windows-2022
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
      BINARY_SOURCE: '680c4f0c4439bd7435addebfc57a1a16c3c320e3'
      BINARY_RUN: '41295495489'
      REPLAY_RUN: '41296844301'
      COMPILER_TEST_SOURCE_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/recovery/evidence/
      - uses: actions/download-artifact@v4
        with:
          name: refactor-core-lifecycle-41295495489-1
          github-token: ${{ github.token }}
          run-id: 41295495489
          path: work/original-acceptance
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Install pinned deployment acceptance dependencies
        run: python -m pip install -r recovery/probes/TextureRedirect/requirements.txt -r recovery/scripts/app-protocol-requirements.txt lxml==6.0.2
      - name: Select unchanged production source and corrected owner-route expectations
        shell: pwsh
        run: |
          git diff --exit-code $env:BINARY_SOURCE HEAD -- recovery/src SDK ui recovery/build 'recovery/scripts/Build*.ps1' recovery/scripts/RestoreUiDependencies.ps1
          if($LASTEXITCODE -ne 0){throw 'Production closure changed'}
          git checkout --detach $env:BINARY_SOURCE
          if($LASTEXITCODE -ne 0){throw 'Cannot select production source'}
          git restore --source=$env:COMPILER_TEST_SOURCE_COMMIT -- recovery/scripts/TestCompilerBig.ps1 recovery/scripts/MeasureCompilerParallel.py recovery/tests/CompilerXmlBackendBatch.cs
          if($LASTEXITCODE -ne 0){throw 'Cannot select current validation scripts'}
          New-Item -ItemType Directory -Force -Path @('recovery/artifacts','recovery/evidence/refactor/core-cli')|Out-Null
          Copy-Item work/original-acceptance/artifacts/core-lifecycle-product recovery/artifacts/ -Recurse
          Copy-Item "work/original-acceptance/evidence/refactor/core-cli/$env:BINARY_RUN-1" recovery/evidence/refactor/core-cli/ -Recurse
      - name: Complete unchanged 284-route worker matrix and exact sixteen owner routes
        shell: pwsh
        run: ./recovery/scripts/TestCompilerCoreLifecycle.ps1 -CompilerDirectory recovery/artifacts/core-lifecycle-product -FixtureNames CompilerXmlBackendBatch -OutputDirectory "recovery/evidence/refactor/core-lifecycle/$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
      - name: Wait for independent replay groups and require their actual successful results
        shell: pwsh
        run: |
          $deadline=[DateTime]::UtcNow.AddMinutes(20)
          do {
            $jobs=(gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:REPLAY_RUN/jobs"|ConvertFrom-Json).jobs
            if($LASTEXITCODE -ne 0){throw 'Cannot query replay jobs'}
            $job=@($jobs|Where-Object name -eq 'replay')[0]
            if($job.status -ceq 'completed'){break}
            if([DateTime]::UtcNow -gt $deadline){throw 'Independent replay did not finish within the release budget'}
            Start-Sleep -Seconds 30
          } while($true)
          $required=@('Verify production closure and reuse only independently successful source scopes','Replay original BAB targeted backend oracle','Replay profiling and original byte gates with explicit BIG version','Replay complete parallel and cache matrix in independent namespaces','Complete production BIG original LoD MakeBig and Additional acceptance','Complete mymod original SDK differential with explicit BIG version')
          foreach($name in $required){if(@($job.steps|Where-Object{$_.name -ceq $name -and $_.conclusion -ceq 'success'}).Count -ne 1){throw "Independent replay did not pass: $name"}}
          $out="recovery/evidence/refactor/release-final/$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT";New-Item -ItemType Directory -Force $out|Out-Null
          @{binarySourceCommit=$env:BINARY_SOURCE;binaryBuildRunId=$env:BINARY_RUN;replayRunId=$env:REPLAY_RUN;replayConclusion=$job.conclusion;reusedSuccessfulSteps=$required;testSourceCommit=$env:COMPILER_TEST_SOURCE_COMMIT;runId=$env:GITHUB_RUN_ID;scope='Exact owner-route correction plus independently successful replay groups, preserving both prior failed run conclusions'}|ConvertTo-Json -Depth 8|Set-Content "$out/reuse.json"
      - uses: actions/download-artifact@v4
        with:
          name: compiler-release-replay-41296844301-1
          github-token: ${{ github.token }}
          run-id: 41296844301
          path: work/replay-acceptance
      - name: Verify every other Core fixture and all applicable accepted scopes
        shell: pwsh
        run: |
          $base="work/replay-acceptance/evidence/refactor"
          $core=Get-Content "$base/core-lifecycle/$env:REPLAY_RUN-1/validation.json" -Raw|ConvertFrom-Json
          foreach($mode in @('Debug','Release')){
            $rows=@($core.modes|Where-Object configuration -eq $mode)
            if($rows.Count -ne 1 -or $rows[0].fixtures.Count -ne 12){throw 'Incomplete prior Core matrix'}
            foreach($fixture in @($rows[0].fixtures|Where-Object name -ne 'CompilerXmlBackendBatch')){if(!$fixture.passed){throw "Prior independent Core fixture failed: $mode/$($fixture.name)"}}
          }
          $receipt=Get-Content "$base/release-replay/$env:REPLAY_RUN-1/reuse.json" -Raw|ConvertFrom-Json
          if(!$receipt.productionInputsUnchanged -or $receipt.binarySourceCommit -cne $env:BINARY_SOURCE -or $receipt.binaryBuildRunId -cne $env:BINARY_RUN){throw 'Prior production reuse identity differs'}
          foreach($scope in @('core-lifecycle','big')){
            python recovery/scripts/ValidateAppProtocol.py "$base/$scope/$env:REPLAY_RUN-1" --source-commit $env:BINARY_SOURCE --output "$base/$scope/$env:REPLAY_RUN-1/protocol.json"
            if($LASTEXITCODE -ne 0){throw 'Independent replay protocol validation failed'}
          }
          Copy-Item "$base/*" recovery/evidence/refactor/ -Recurse -Force
      - name: Verify exact independently extracted three-file runtime ZIPs
        shell: pwsh
        run: ./recovery/scripts/PublishCompiler.ps1 -CompilerDirectory recovery/artifacts/core-lifecycle-product -AcceptanceReceipt "recovery/evidence/refactor/core-cli/$env:BINARY_RUN-1/validation.json" -VerifyBigDeployment -OutputDirectory "recovery/artifacts/final-release/$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
      - name: Full Upheaval jobs 1 4 auto cold hot and modified original-byte matrix
        timeout-minutes: 24
        shell: pwsh
        run: |
          python recovery/scripts/MeasureCompilerParallel.py --repo . --exe recovery/artifacts/core-lifecycle-product/Release/bin/NewModCompiler.exe --work "$env:RUNNER_TEMP/release-upheaval" --output "recovery/evidence/refactor/backend-parallel-performance/$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT" --source-commit $env:BINARY_SOURCE --timeout 240 --budget 1320
          if($LASTEXITCODE -ne 0){throw 'Full Upheaval raw byte acceptance failed'}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compiler-release-final-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            recovery/artifacts/core-lifecycle-product/**/build.json
            recovery/artifacts/core-lifecycle-product/**/link-inputs.json
            recovery/artifacts/core-lifecycle-product/**/bin/*
            recovery/artifacts/final-release/**
            recovery/evidence/refactor/**
          if-no-files-found: error
