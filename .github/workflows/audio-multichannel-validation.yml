name: Audio WAVE multichannel validation
on:
  push:
    branches: [recovery/audio-compiler-source, validation/audio-upheaval-win32]
    paths:
      - '.github/workflows/audio-multichannel-validation.yml'
      - 'recovery/scripts/TestAudioMultichannelOriginal.ps1'
      - 'recovery/tests/AudioMultichannelOriginalProbe.cs'
      - 'recovery/src/Managed/Audio/**'
      - 'recovery/scripts/TestAudioMultichannel.ps1'
      - 'recovery/scripts/TestAudioPlugin.ps1'
      - 'recovery/scripts/TestAudioSdk.ps1'
      - 'recovery/tests/AudioMultichannelCases.cs'
      - 'recovery/tests/AudioMultichannelBoundaryOracle.cs'
      - 'recovery/tests/AudioMultichannelDirectOracle.cs'
      - 'recovery/tests/AudioPluginOracle.cs'
      - 'recovery/tests/AudioSdkSupport.cs'
permissions:
  contents: read
concurrency:
  group: audio-multichannel-original-${{ github.ref }}
  cancel-in-progress: false
jobs:
  discover:
    if: contains(github.event.head_commit.message, '[audio-multichannel-original]')
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Isolated original Win32 multichannel discovery
        shell: pwsh
        run: ./recovery/scripts/TestAudioMultichannelOriginal.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audio-multichannel-original-${{ github.run_id }}-${{ github.run_attempt }}
          path: recovery/evidence/audio/multichannel-original/${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
  validate:
    if: contains(github.event.head_commit.message, '[audio-multichannel]')
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install original XAS machine-code oracle dependencies
        shell: pwsh
        run: python -m pip install unicorn==2.1.4 pefile==2024.8.26
      - name: Complete new and affected ordinary plugin differential
        shell: pwsh
        run: ./recovery/scripts/TestAudioMultichannel.ps1
      - name: Complete affected shared-importer regressions
        shell: pwsh
        run: |
          ./recovery/scripts/TestAudioAifc.ps1 -SkipSdk
          ./recovery/scripts/TestAudioAdp4Plugin.ps1
          ./recovery/scripts/TestAudioAiffSsnd.ps1 -SkipLoopRegression
          ./recovery/scripts/TestAudioLoopMetadata.ps1
          ./recovery/scripts/TestAudioLoopOptionalMetadata.ps1
          ./recovery/scripts/TestAudioAiffMarkerRange.ps1
          ./recovery/scripts/TestAudioAiffOffset.ps1
          ./recovery/scripts/TestAudioXasPrecision.ps1
          ./recovery/scripts/BuildAudioSource.ps1
      - name: Real SDK WAVE multichannel milestone after component success
        if: success()
        shell: pwsh
        run: ./recovery/scripts/TestAudioSdk.ps1 -MultichannelOnly -TimeoutSeconds 600
      - name: Upload exact batch evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audio-multichannel-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          path: recovery/evidence/audio/*/${{ github.run_id }}-${{ github.run_attempt }}
